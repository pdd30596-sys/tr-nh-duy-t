              // ---- lịch sử ----
              private fun openHistory() {
                  val ref = arrayOfNulls<LinearLayout>(1)
                  val (f, body) = screen("Lịch sử", "Xóa tất cả") {
                      dlg().setMessage("Xóa toàn bộ lịch sử?").setPositiveButton("Xóa") { _, _ ->
                          Store.clearHistory(this); ref[0]?.removeAllViews(); toast("Đã xóa lịch sử")
                      }.setNegativeButton("Hủy", null).show()
                  }
                  val search = EditText(this)
                  search.hint = "Tìm trong lịch sử"
                  search.setHintTextColor(P.muted); search.setTextColor(P.text); search.textSize = 14f
                  search.isSingleLine = true
                  search.background = rr(this, P.surface, 24, P.line)
                  search.setPadding(dp(16), 0, dp(16), 0)
                  body.addView(search, lp(MATCH, dp(48)))
                  val list = LinearLayout(this)
                  list.orientation = LinearLayout.VERTICAL
                  ref[0] = list
                  body.addView(list, lp(MATCH, WRAP))
                  val dayFmt = SimpleDateFormat("dd/MM/yyyy", Locale.US)
                  val timeFmt = SimpleDateFormat("HH:mm", Locale.US)
                  fun dayLabel(ts: Long): String {
                      val a = Calendar.getInstance(); a.timeInMillis = ts
                      val b = Calendar.getInstance()
                      val d = (startOfDay(b) - startOfDay(a)) / 86400000L
                      return if (d == 0L) "Hôm nay" else if (d == 1L) "Hôm qua" else dayFmt.format(Date(ts))
                  }
                  fun render(q: String) {
                      list.removeAllViews()
                      val items = Store.history(this).filter { q.isBlank() || it.title.contains(q, true) || it.url.contains(q, true) }.take(300)
                      if (items.isEmpty()) { val e = tv(this, "Chưa có lịch sử.", 14f, P.muted); e.setPadding(0, dp(16), 0, 0); list.addView(e); return }
                      var last = ""
                      for (h in items) {
                          val dl = dayLabel(h.ts)
                          if (dl != last) {
                              last = dl
                              val d = tv(this, dl.uppercase(), 12f, P.muted, true)
                              d.setPadding(0, dp(16), 0, dp(4))
                              list.addView(d)
                          }
                          val r = LinearLayout(this)
                          r.gravity = Gravity.CENTER_VERTICAL
                          val col = LinearLayout(this)
                          col.orientation = LinearLayout.VERTICAL
                          val t1 = tv(this, h.title.ifBlank { h.url }, 14f, P.text, true); t1.maxLines = 1; t1.ellipsize = android.text.TextUtils.TruncateAt.END
                          col.addView(t1)
                          col.addView(tv(this, hostOf(h.url) + " · " + timeFmt.format(Date(h.ts)), 12f, P.muted))
                          r.addView(col, lp(0, WRAP, 1f))
                          val x = IconView(this, 5)
                          x.color = P.muted
                          x.contentDescription = "Xóa"
                          x.setOnClickListener { Store.removeHistory(this, h.ts); render(search.text.toString()) }
                          r.addView(x, lp(dp(44), dp(44)))
                          r.minimumHeight = dp(56)
                          col.setOnClickListener { while (overlays.isNotEmpty()) popOverlay(); go(h.url) }
                          list.addView(r, lp(MATCH, WRAP))
                      }
                  }
                  search.addTextChangedListener(object : android.text.TextWatcher {
                      override fun afterTextChanged(s: android.text.Editable?) { render(s?.toString() ?: "") }
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                  })
                  render("")
                  pushOverlay(f)
              }

              private fun startOfDay(c: Calendar): Long {
                  c.set(Calendar.HOUR_OF_DAY, 0); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0)
                  return c.timeInMillis
              }

              // ---- tải xuống ----
              private fun openDownloads() {
                  val (f, body) = screen("Tải xuống")
                  f.tag = "dl"
                  val list = LinearLayout(this)
                  list.orientation = LinearLayout.VERTICAL
                  body.addView(list, lp(MATCH, WRAP))
                  val loc = tv(this, "Tệp lưu trong thư mục Movies/Luot, xem được bằng app Thư viện hoặc Tệp của máy.", 12f, P.muted)
                  body.addView(loc, lp(MATCH, WRAP))
                  fun render() {
                      list.removeAllViews()
                      if (Downloader.items.isEmpty()) {
                          val e = tv(this, "Chưa có tệp nào. Bấm bong bóng video trên trang web rồi chọn Tải về.", 14f, P.muted)
                          e.setPadding(0, dp(16), 0, dp(16)); list.addView(e)
                      }
                      for (d in Downloader.items) {
                          val card = LinearLayout(this)
                          card.orientation = LinearLayout.VERTICAL
                          card.background = rr(this, P.surface, 16, P.line)
                          card.setPadding(dp(14), dp(12), dp(14), dp(12))
                          val nm = tv(this, d.fileName.ifBlank { d.name }, 14f, P.text, true); nm.maxLines = 2
                          card.addView(nm)
                          if (d.status <= 1) {
                              val pb = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                              pb.isIndeterminate = d.progress < 0
                              pb.max = 100; pb.progress = d.progress.coerceAtLeast(0)
                              pb.progressTintList = android.content.res.ColorStateList.valueOf(P.accent)
                              val pp = lp(MATCH, dp(10)); pp.topMargin = dp(8)
                              card.addView(pb, pp)
                          }
                          val info = tv(this, (if (d.status == 1 && d.progress >= 0) "${d.progress}% · " else "") + d.info, 12f, if (d.status == 3) P.video else P.muted)
                          val ip = lp(MATCH, WRAP); ip.topMargin = dp(4)
                          card.addView(info, ip)
                          val br = LinearLayout(this)
                          val bp = lp(MATCH, WRAP); bp.topMargin = dp(8)
                          if (d.status <= 1) {
                              br.addView(btn(this, "Hủy", P.bg, P.video, P.line) { d.cancel = true }, lp(0, WRAP, 1f))
                          } else if (d.status == 2 && d.uri != null) {
                              br.addView(btn(this, "Phát", P.accent, P.onAccent, 0) {
                                  startActivity(Intent(this, PlayerActivity::class.java).putExtra("url", d.uri).putExtra("title", d.fileName))
                              }, lp(0, WRAP, 1f))
                              val o = lp(0, WRAP, 1f); o.leftMargin = dp(8)
                              br.addView(btn(this, "App khác", P.bg, P.text, P.line) {
                                  try {
                                      val i = Intent(Intent.ACTION_VIEW); i.setDataAndType(Uri.parse(d.uri ?: ""), "video/*"); i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      startActivity(Intent.createChooser(i, "Mở bằng"))
                                  } catch (e: Exception) { toast("Không có app phù hợp") }
                              }, o)
                              val x = lp(0, WRAP, 1f); x.leftMargin = dp(8)
                              br.addView(btn(this, "Xóa dòng", P.bg, P.muted, P.line) { Downloader.items.remove(d); Downloader.persist(this); render() }, x)
                          } else {
                              br.addView(btn(this, "Xóa dòng", P.bg, P.muted, P.line) { Downloader.items.remove(d); Downloader.persist(this); render() }, lp(0, WRAP, 1f))
                          }
                          card.addView(br, bp)
                          val cp = lp(MATCH, WRAP); cp.topMargin = dp(10)
                          list.addView(card, cp)
                      }
                  }
                  dlRefresh = { render() }
                  render()
                  pushOverlay(f)
              }

