              /** Mở thẳng bằng trình xem video khác (MX Player, VLC...), không cần phát trước. */
              private fun openExternalVideo(m: MediaItem, t: Tab) {
                  try {
                      val ua = t.web?.settings?.userAgentString ?: ""
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(Uri.parse(m.url), "video/*")
                      i.putExtra("title", t.title)
                      val hd = ArrayList<String>()
                      if (ua.isNotEmpty()) { hd.add("User-Agent"); hd.add(ua) }
                      if (!m.referer.isNullOrEmpty()) { hd.add("Referer"); hd.add(m.referer) }
                      if (hd.isNotEmpty()) i.putExtra("headers", hd.toTypedArray())
                      val pm = packageManager
                      val probe = Intent(Intent.ACTION_VIEW, Uri.parse("https://example.com")).addCategory(Intent.CATEGORY_BROWSABLE)
                      val browsers = HashSet<String>()
                      for (ri in pm.queryIntentActivities(probe, 0)) browsers.add(ri.activityInfo.packageName)
                      val ex = ArrayList<ComponentName>()
                      val players = ArrayList<String>()
                      for (ri in pm.queryIntentActivities(i, 0)) {
                          val pk = ri.activityInfo.packageName
                          if (pk == packageName || browsers.contains(pk)) ex.add(ComponentName(pk, ri.activityInfo.name))
                          else if (!players.contains(pk)) players.add(pk)
                      }
                      if (players.size == 1) {
                          i.setPackage(players[0])
                          startActivity(i)
                      } else {
                          val ch = Intent.createChooser(i, "Mở video bằng")
                          ch.putExtra(Intent.EXTRA_EXCLUDE_COMPONENTS, ex.toTypedArray())
                          startActivity(ch)
                      }
                  } catch (e: Exception) { toast("Không có app xem video phù hợp") }
              }

              /** Chạm/nhấn giữ bong bóng: mở thẳng ngoài nếu chỉ có 1 video, nhiều video thì hiện danh sách. */
              private fun bubbleDirect() {
                  val t = tabs[cur]
                  if (t.media.size == 1) openExternalVideo(t.media[0], t) else openMedia()
              }

