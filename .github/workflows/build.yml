                  sSw(body, "Ưu tiên HTTPS", "Tự chuyển http sang https, nếu trang không hỗ trợ sẽ quay lại http", httpsOnly) { Store.setFlag(this, "https", it); httpsOnly = it }
                  sSw(body, "Chống vân tay trình duyệt (thử nghiệm)", "Làm nhiễu canvas và thông số máy. Có thể làm lỗi vài trang", fp) { Store.setFlag(this, "fp", it); fp = it }
                  sSw(body, "Tự xóa cookie khi đóng app", "Đóng hẳn app sẽ xóa cookie và dữ liệu trang", Store.flag(this, "wipe", false)) { Store.setFlag(this, "wipe", it) }
                  body.addView(tv(this, "Ghi chú: các lớp bảo vệ bằng JavaScript chỉ chạy sau khi trang bắt đầu tải nên không tuyệt đối. Trang bị lỗi thì tắt chặn riêng trang đó bằng nút Chặn trên thanh địa chỉ. Quyền vị trí, camera, micro của trang luôn bị từ chối.", 12f, P.muted))

                  sSec(body, "Riêng tư")
                  sSw(body, "Lưu lịch sử xem", "Tắt thì trang mới không được ghi lại", Store.saveHist(this)) { Store.setSaveHist(this, it) }
                  val clr = btn(this, "Xóa cookie, bộ nhớ đệm và lịch sử", P.surface, P.text, P.line) {
                      CookieManager.getInstance().removeAllCookies(null)
                      WebStorage.getInstance().deleteAllData()
                      for (t in tabs) { t.web?.clearCache(true); t.web?.clearFormData() }
                      Store.clearHistory(this)
                      toast("Đã xóa cookie, bộ nhớ đệm và lịch sử")
                  }
                  val cp = lp(MATCH, WRAP); cp.topMargin = dp(8)
                  body.addView(clr, cp)

              }

              private fun settingsAbout() = settingsPage("Giới thiệu") { body ->
                  val ver = try { packageManager.getPackageInfo(packageName, 0).versionName } catch (e: Exception) { "" }
                  body.addView(tv(this, "Trình Duyệt", 24f, P.text, true))
                  body.addView(tv(this, "Phiên bản $ver", 13f, P.muted))
                  val d = tv(this, "Trình duyệt web gọn nhẹ: chặn quảng cáo và popup, chống theo dõi, bắt và tải video (mp4, m3u8), trình phát riêng, tab dạng lưới, yêu thích, lịch sử, tìm trong trang, dịch trang, xem bản máy tính, giao diện sáng tối.", 14f, P.text)
                  d.setLineSpacing(0f, 1.2f)
                  val dp0 = lp(MATCH, WRAP); dp0.topMargin = dp(16)
                  body.addView(d, dp0)
                  val n = tv(this, "Video có bảo vệ bản quyền (DRM), luồng trực tiếp và định dạng DASH không tải được. Chỉ tải nội dung bạn có quyền sử dụng.", 12f, P.muted)
                  val np = lp(MATCH, WRAP); np.topMargin = dp(16)
                  body.addView(n, np)
              }

              // ================= nút Back =================
              @Suppress("OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  if (customView != null) { hideCustom(); return }
                  if (findBar != null) { closeFind(); return }
                  if (overlays.isNotEmpty()) { popOverlay(); return }
                  val t = tabs[cur]
                  val w = t.web
                  if (w != null && w.canGoBack()) { w.goBack(); return }
                  if (w != null && t.opener != null && tabs.contains(t.opener)) { closeToOpener(t); return }
                  if (w != null) { goHome(); return }
                  if (tabs.size > 1) { closeTab(cur); showTab(); return }
                  super.onBackPressed()
              }
          }
