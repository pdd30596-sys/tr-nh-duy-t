              private fun scriptDialog(existing: UScript?, presetCode: String?) {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(20), dp(8), dp(20), 0)
                  val n = EditText(this); n.hint = "Tên script"
                  val m = EditText(this); m.hint = "Trang áp dụng (vd: youtube.com, *.abc.com, * = mọi trang)"
                  val cd = EditText(this)
                  cd.hint = "Mã JavaScript"
                  cd.minLines = 8
                  cd.gravity = Gravity.TOP
                  cd.textSize = 12f
                  cd.typeface = android.graphics.Typeface.MONOSPACE
                  cd.inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE or android.text.InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                  if (existing != null) { n.setText(existing.name); m.setText(existing.match); cd.setText(Ext.code(this, existing.id)) }
                  else if (presetCode != null) {
                      cd.setText(presetCode)
                      val h = Ext.parseHeader(presetCode)
                      n.setText(h.first); m.setText(h.second)
                  }
                  box.addView(n); box.addView(m); box.addView(cd)
                  val sv = ScrollView(this)
                  sv.addView(box)
                  dlg().setTitle(if (existing == null) "Thêm userscript" else "Sửa userscript").setView(sv)
                      .setPositiveButton("Lưu") { _, _ ->
                          val code = cd.text.toString()
                          if (code.isBlank()) { toast("Chưa có mã script"); return@setPositiveButton }
                          val h = Ext.parseHeader(code)
                          val name = n.text.toString().trim().ifEmpty { h.first.ifEmpty { "Script" } }
                          val match = m.text.toString().trim().ifEmpty { h.second }
                          if (match.isEmpty()) { toast("Hãy nhập trang áp dụng"); return@setPositiveButton }
                          Ext.save(this, UScript(existing?.id ?: Ext.newId(), name, existing?.enabled ?: true, match), code)
                          extRefresh?.invoke()
                      }.setNegativeButton("Hủy", null).show()
              }

