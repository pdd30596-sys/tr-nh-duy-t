              // ================= lớp phủ =================
              private fun pushOverlay(v: View) {
                  overlays.add(v)
                  root.addView(v, FrameLayout.LayoutParams(MATCH, MATCH))
                  bubble.visibility = View.GONE
              }

              private fun popOverlay() {
                  if (overlays.isEmpty()) return
                  val v = overlays.removeAt(overlays.size - 1)
                  if (v.tag == "dl") dlRefresh = null
                  if (v.tag == "wp") wpRefresh = null
                  if (v.tag == "ext") extRefresh = null
                  root.removeView(v)
                  showTab()
              }

              private fun screen(title: String, action: String? = null, onAction: (() -> Unit)? = null): Pair<FrameLayout, LinearLayout> {
                  val f = FrameLayout(this)
                  f.setBackgroundColor(P.bg)
                  f.isClickable = true
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  val head = LinearLayout(this)
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.setPadding(dp(8), dp(12), dp(16), dp(4))
                  val back = IconView(this, 0)
                  back.color = P.text
                  back.contentDescription = "Quay lại"
                  back.setOnClickListener { popOverlay() }
                  head.addView(back, lp(dp(48), dp(48)))
                  head.addView(tv(this, title, 22f, P.text, true), lp(0, WRAP, 1f))
                  if (action != null) {
                      val a = tv(this, action, 14f, P.video, true)
                      a.gravity = Gravity.CENTER
                      a.minHeight = dp(48)
                      a.setOnClickListener { onAction?.invoke() }
                      head.addView(a)
                  }
                  col.addView(head)
                  val sv = ScrollView(this)
                  val body = LinearLayout(this)
                  body.orientation = LinearLayout.VERTICAL
                  body.setPadding(dp(20), dp(4), dp(20), dp(24))
                  sv.addView(body)
                  col.addView(sv, lp(MATCH, 0, 1f))
                  f.addView(col, FrameLayout.LayoutParams(MATCH, MATCH))
                  return Pair(f, body)
              }

              private fun sheet(): Triple<FrameLayout, LinearLayout, View> {
                  val f = FrameLayout(this)
                  f.setBackgroundColor(0x88000000.toInt())
                  f.isClickable = true
                  f.setOnClickListener { popOverlay() }
                  val panel = LinearLayout(this)
                  panel.orientation = LinearLayout.VERTICAL
                  val g = rr(this, P.surface, 24, P.line)
                  g.cornerRadii = floatArrayOf(dp(24).toFloat(), dp(24).toFloat(), dp(24).toFloat(), dp(24).toFloat(), 0f, 0f, 0f, 0f)
                  panel.background = g
                  panel.setPadding(dp(16), dp(12), dp(16), dp(20))
                  panel.isClickable = true
                  val handle = View(this)
                  handle.background = rr(this, P.line, 2)
                  val hp = lp(dp(40), dp(4)); hp.gravity = Gravity.CENTER_HORIZONTAL; hp.bottomMargin = dp(8)
                  panel.addView(handle, hp)
                  f.addView(panel, FrameLayout.LayoutParams(MATCH, WRAP, Gravity.BOTTOM))
                  return Triple(f, panel, handle)
              }

              // ---- menu (lưới ô tính năng, vuốt ngang, sắp xếp được) ----
              private class MenuItem(val id: String, val icon: Int, val label: String, val show: Boolean, val act: () -> Unit)

              private fun menuCatalog(): List<MenuItem> {
                  val t = tabs[cur]
                  val on = t.web != null && t.url.isNotEmpty()
                  val bm = on && Store.isBookmark(this, t.url)
                  val tr = on && isTranslated(t.url)
                  return listOf(
                      MenuItem("bm", if (bm) R.drawable.ic_m_bm_on else R.drawable.ic_m_bm, if (bm) "Bỏ yêu thích" else "Thêm yêu thích", on) { toggleBookmark() },
                      MenuItem("share", R.drawable.ic_m_share, "Chia sẻ liên kết", on) { shareText(t.url) },
                      MenuItem("copy", R.drawable.ic_m_copy, "Sao chép liên kết", on) { copy(t.url) },
                      MenuItem("other", R.drawable.ic_m_other, "Mở bằng app khác", on) { openOther(t.url) },
                      MenuItem("media", R.drawable.ic_m_media, "Video trên trang (${t.media.size})", on) { openMedia() },
                      MenuItem("find", R.drawable.ic_m_find, "Tìm trong trang", on) { openFind() },
                      MenuItem("trans", R.drawable.ic_m_trans, if (tr) "Xem bản gốc" else "Dịch trang", on) { if (tr) showOriginal() else translateDialog() },
                      MenuItem("zoom", R.drawable.ic_m_zoom, "Cỡ chữ (${Store.textZoom(this)}%)", on) { openTextSize() },
                      MenuItem("desk", if (t.desktop) R.drawable.ic_m_phone else R.drawable.ic_m_desk, if (t.desktop) "Bản di động" else "Bản máy tính", on) { toggleDesktop() },
                      MenuItem("reload", R.drawable.ic_m_reload, "Làm mới trang", on) { t.web?.reload() },
                      MenuItem("extsite", R.drawable.ic_m_ext, "Tiện ích trên trang", on) { openSiteExt() },
                      MenuItem("exts", R.drawable.ic_m_ext, "Tiện ích", true) { openExtensions() },
                      MenuItem("wall", R.drawable.ic_m_img, "Hình nền", true) { openWallpaper() },
                      MenuItem("favs", R.drawable.ic_m_favs, "Yêu thích", true) { openFavorites() },
                      MenuItem("dl", R.drawable.ic_m_dl, "Tải xuống", true) { openDownloads() },
                      MenuItem("hist", R.drawable.ic_m_hist, "Lịch sử", true) { openHistory() },
                      MenuItem("set", R.drawable.ic_m_set, "Cài đặt", true) { openSettings() }
                  )
              }

              private fun openMenu() {
                  val (f, panel, _) = sheet()
                  val cat = menuCatalog()
                  val defaults = cat.map { it.id }
                  val order = ArrayList<String>()
                  for (id in Store.menuOrder(this)) if (defaults.contains(id) && !order.contains(id)) order.add(id)
                  for (id in defaults) if (!order.contains(id)) order.add(id)   // tính năng mới tự thêm vào cuối

                  var editing = false
                  var sel: String? = null
                  var page = 0
                  val pw = resources.displayMetrics.widthPixels - dp(32)
                  val cw = pw / 4
                  val th = dp(92)
                  val body = LinearLayout(this)
                  body.orientation = LinearLayout.VERTICAL
                  panel.addView(body, lp(MATCH, WRAP))

                  fun render() {
                      body.removeAllViews()
                      val items = order.mapNotNull { id -> cat.firstOrNull { it.id == id && it.show } }

                      val head = LinearLayout(this)
                      head.gravity = Gravity.CENTER_VERTICAL
                      head.addView(tv(this, if (editing) "Sắp xếp tính năng" else "Tính năng", 18f, P.text, true), lp(0, WRAP, 1f))
                      if (editing) {
                          val reset = tv(this, "Mặc định", 14f, P.muted, true)
                          reset.setPadding(dp(10), dp(12), dp(10), dp(12))
                          reset.setOnClickListener {
                              order.clear(); order.addAll(defaults); sel = null
                              Store.setMenuOrder(this, order); render()
                          }
                          head.addView(reset)
                      }
                      val tog = tv(this, if (editing) "Xong" else "Sắp xếp", 14f, P.accent, true)
                      tog.setPadding(dp(10), dp(12), dp(4), dp(12))
                      tog.setOnClickListener { editing = !editing; sel = null; render() }
                      head.addView(tog)
                      body.addView(head, lp(MATCH, WRAP))
                      if (editing) {
                          val hint = tv(this, "Chạm một ô, rồi chạm ô khác để đổi chỗ. Vuốt ngang để sang trang khác.", 12f, P.muted)
                          val hp = lp(MATCH, WRAP); hp.bottomMargin = dp(4)
                          body.addView(hint, hp)
                      }

                      val perPage = 12
                      val pages = maxOf(1, (items.size + perPage - 1) / perPage)
                      page = page.coerceIn(0, pages - 1)
                      val rows = if (pages > 1) 3 else maxOf(1, (items.size + 3) / 4)

                      val hs = android.widget.HorizontalScrollView(this)
                      hs.isHorizontalScrollBarEnabled = false
                      hs.overScrollMode = View.OVER_SCROLL_NEVER
                      val strip = LinearLayout(this)
                      strip.orientation = LinearLayout.HORIZONTAL
                      for (p in 0 until pages) {
                          val pg = LinearLayout(this)
                          pg.orientation = LinearLayout.VERTICAL
                          for (r in 0 until rows) {
                              val row = LinearLayout(this)
                              row.orientation = LinearLayout.HORIZONTAL
                              for (c in 0 until 4) {
                                  val idx = p * perPage + r * 4 + c
                                  val cell = FrameLayout(this)
                                  if (idx < items.size) {
                                      val m = items[idx]
                                      val isSel = editing && sel == m.id
                                      val card = LinearLayout(this)
                                      card.orientation = LinearLayout.VERTICAL
                                      card.gravity = Gravity.CENTER_HORIZONTAL
                                      card.setPadding(dp(2), dp(8), dp(2), dp(4))
                                      val circ = FrameLayout(this)
                                      circ.background = rr(this, if (isSel) P.accent else P.bg, 24, if (isSel) P.accent else P.line)
                                      val img = ImageView(this)
                                      img.setImageResource(m.icon)
                                      img.setColorFilter(if (isSel) P.onAccent else if (m.id == "media") P.video else P.accent)
                                      circ.addView(img, FrameLayout.LayoutParams(dp(22), dp(22), Gravity.CENTER))
                                      card.addView(circ, lp(dp(48), dp(48)))
                                      val lb = tv(this, m.label, 11f, if (isSel) P.accent else P.text)
                                      lb.gravity = Gravity.CENTER
                                      lb.maxLines = 2
                                      lb.ellipsize = android.text.TextUtils.TruncateAt.END
                                      val lq = lp(MATCH, WRAP); lq.topMargin = dp(6)
                                      card.addView(lb, lq)
                                      cell.addView(card, FrameLayout.LayoutParams(MATCH, MATCH))
                                      cell.contentDescription = m.label
                                      cell.setOnClickListener {
                                          if (!editing) { popOverlay(); m.act() }
                                          else {
                                              val s = sel
                                              if (s == null) { sel = m.id; render() }
                                              else if (s == m.id) { sel = null; render() }
                                              else {
                                                  val a = order.indexOf(s); val b = order.indexOf(m.id)
                                                  val tmp = order[a]; order[a] = order[b]; order[b] = tmp
                                                  sel = null
                                                  Store.setMenuOrder(this, order)
                                                  render()
                                              }
                                          }
                                      }
                                      cell.setOnLongClickListener {
                                          if (!editing) { editing = true; sel = m.id; render() }
                                          true
                                      }
                                  }
                                  row.addView(cell, lp(cw, th))
                              }
                              pg.addView(row, lp(pw, WRAP))
                          }
                          strip.addView(pg, lp(pw, WRAP))
                      }
                      hs.addView(strip)
                      body.addView(hs, lp(MATCH, WRAP))

                      val dots = ArrayList<View>()
                      if (pages > 1) {
                          val dr = LinearLayout(this)
                          dr.gravity = Gravity.CENTER
                          for (i in 0 until pages) {
                              val d = View(this)
                              dots.add(d)
                              val q = lp(dp(6), dp(6)); q.leftMargin = dp(3); q.rightMargin = dp(3)
                              dr.addView(d, q)
                          }
                          val dq = lp(MATCH, WRAP); dq.topMargin = dp(8)
                          body.addView(dr, dq)
                      }
                      fun paintDots() { for (i in dots.indices) { dots[i].background = rr(this, if (i == page) P.accent else P.line, 3); val q = dots[i].layoutParams as LinearLayout.LayoutParams; q.width = if (i == page) dp(16) else dp(6); dots[i].layoutParams = q } }
                      fun snapTo(n: Int) {
                          page = n.coerceIn(0, pages - 1)
                          hs.smoothScrollTo(page * pw, 0)
                          paintDots()
                      }
                      paintDots()
                      var startX = 0
                      hs.setOnTouchListener { _, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> startX = hs.scrollX
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                  val d = hs.scrollX - page * pw
                                  val target = if (d > pw * 0.15f) page + 1 else if (d < -pw * 0.15f) page - 1 else page
                                  hs.post { snapTo(target) }
                              }
                          }
                          false
                      }
                      hs.post { hs.scrollTo(page * pw, 0) }
                  }
                  render()
                  pushOverlay(f)
              }

