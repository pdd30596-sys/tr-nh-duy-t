              private fun addShortcutDialog() {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(20), dp(8), dp(20), 0)
                  val n = EditText(this); n.hint = "Tên"
                  val u = EditText(this); u.hint = "Địa chỉ (vd: vnexpress.net)"
                  u.inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_VARIATION_URI
                  box.addView(n); box.addView(u)
                  dlg().setTitle("Thêm lối tắt").setView(box).setPositiveButton("Thêm") { _, _ ->
                      if (n.text.isNotBlank() && u.text.isNotBlank()) {
                          val l = Store.shortcuts(this)
                          l.add(Pair(n.text.toString().trim(), toUrl(u.text.toString())))
                          Store.saveShortcuts(this, l); showTab()
                      }
                  }.setNegativeButton("Hủy", null).show()
              }

              // ================= WebView =================
              @Suppress("DEPRECATION")
              private fun makeWeb(tab: Tab): WebView {
                  val w = WebView(this)
                  val s = w.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.setSupportMultipleWindows(true)
                  s.javaScriptCanOpenWindowsAutomatically = true
                  s.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                  s.useWideViewPort = true
                  s.loadWithOverviewMode = true
                  s.builtInZoomControls = true
                  s.displayZoomControls = false
                  s.allowFileAccess = false
                  if (Build.VERSION.SDK_INT >= 33) s.isAlgorithmicDarkeningAllowed = P.dark
                  tab.mobileUa = s.userAgentString
                  s.textZoom = Store.textZoom(this)
                  if (Build.VERSION.SDK_INT >= 26) s.setSafeBrowsingEnabled(true)
                  w.setBackgroundColor(P.bg)
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, !tpcBlock)

                  w.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, req: WebResourceRequest): WebResourceResponse? {
                          val url = req.url.toString()
                          val t = tab
                          if ((adOn || trackOn) && !req.isForMainFrame && !exc.contains(hostOf(t.url))) {
                              val k = AdBlock.classify(url, if (adOn) adLevel else -1, trackOn)
                              if (k != 0) {
                                  blockedTotal++
                                  main.post { t.blocked++; if (k == 2) t.trackers++; if (tabs.getOrNull(cur) === t) updateShield() }
                                  return WebResourceResponse("text/plain", "utf-8", ByteArrayInputStream(ByteArray(0)))
                              }
                          }
                          sniff(t, url)
                          return null
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, req: WebResourceRequest): Boolean {
                          val u = req.url.toString()
                          if (u.startsWith("http://") || u.startsWith("https://")) {
                              if (adOn && !exc.contains(hostOf(tab.url)) && (req.isRedirect || !req.hasGesture() || tab.opener != null) && AdBlock.isAdHost(u, adLevel)) {
                                  tab.popups++; blockedTotal++
                                  if (tab.opener != null && tab.url.isEmpty()) main.post { closeToOpener(tab) }
                                  else if (tabs.getOrNull(cur) === tab) showPill("Đã chặn trang quảng cáo tự chuyển", null, null)
                                  return true
                              }
                              if (req.isForMainFrame && req.method == "GET") {
                                  val ph = tab.pendingHttp
                                  if (ph != null && u.startsWith("http://") && hostOf(ph) == hostOf(u)) { httpFail.add(hostOf(u)); tab.pendingHttp = null }
                                  if (httpsOnly && u.startsWith("http://") && !exc.contains(hostOf(tab.url))) {
                                      val h = hostOf(u)
                                      if (h.contains('.') && !h.endsWith(".local") && !Regex("^(\\d+\\.){3}\\d+$").matches(h) && !httpFail.contains(h)) {
                                          tab.pendingHttp = u
                                          view.loadUrl("https://" + u.removePrefix("http://"))
                                          return true
                                      }
                                  }
                                  if (cleanLinks && !isTranslated(u)) {
                                      val c = cleanUrl(u)
                                      if (c != u) { view.loadUrl(c); return true }
                                  }
                              }
                              return false
                          }
                          if (popupBlock && !req.hasGesture() && !popExc.contains(hostOf(tab.url))) {
                              tab.popups++; blockedTotal++
                              if (tabs.getOrNull(cur) === tab) showPill("Đã chặn trang tự mở ứng dụng khác", null, null)
                              return true
                          }
                          try {
                              if (u.startsWith("intent:")) {
                                  val i = Intent.parseUri(u, Intent.URI_INTENT_SCHEME)
                                  val fb = i.getStringExtra("browser_fallback_url")
                                  if (fb != null) { view.loadUrl(fb); return true }
                                  i.addCategory(Intent.CATEGORY_BROWSABLE); i.component = null; i.selector = null
                                  startActivity(i)
                              } else startActivity(Intent(Intent.ACTION_VIEW, req.url))
                          } catch (e: Exception) { }
                          return true
                      }

                      override fun onPageStarted(view: WebView, url: String, favicon: Bitmap?) {
                          tab.url = url
                          tab.media.clear()
                          tab.blocked = 0
                          tab.popups = 0
                          tab.trackers = 0
                          injectGuards(view, url)
                          CookieManager.getInstance().setAcceptThirdPartyCookies(view, !(tpcBlock && !exc.contains(hostOf(url))))
                          if (tabs.getOrNull(cur) === tab) {
                              if (!urlEdit.hasFocus()) urlEdit.setText(url)
                              updateShield(); updateBubble(); updateNav()
                          }
                      }

                      override fun onPageFinished(view: WebView, url: String) {
                          tab.url = url
                          tab.title = view.title ?: url
                          if (Store.saveHist(this@MainActivity) && url.startsWith("http")) Store.addHistory(this@MainActivity, tab.title, url)
                          tab.pendingHttp = null
                          injectGuards(view, url)
                          if (adOn && !exc.contains(hostOf(url))) view.evaluateJavascript(AdBlock.cosmeticJs(adLevel), null)
                          scanVideos(tab)
                          main.postDelayed({ scanVideos(tab) }, 3000)
                          if (tabs.getOrNull(cur) === tab) updateNav()
                      }

                      override fun doUpdateVisitedHistory(view: WebView, url: String, isReload: Boolean) {
                          tab.url = url
                          if (tabs.getOrNull(cur) === tab) { if (!urlEdit.hasFocus()) urlEdit.setText(url); updateNav() }
                      }

                      override fun onReceivedSslError(view: WebView, handler: android.webkit.SslErrorHandler, error: android.net.http.SslError) {
                          handler.cancel()
                          val pend = tab.pendingHttp
                          if (pend != null && error.url.startsWith("https://")) {
                              httpFail.add(hostOf(pend)); tab.pendingHttp = null
                              view.loadUrl(pend)
                          }
                      }

                      override fun onReceivedError(view: WebView, req: WebResourceRequest, err: WebResourceError) {
                          if (!req.isForMainFrame) return
                          if (req.url.scheme == "https" && httpFail.contains(hostOf(req.url.toString())) && tab.url.startsWith("http://")) return
                          val pend = tab.pendingHttp
                          if (pend != null && req.url.toString().startsWith("https://")) {
                              httpFail.add(hostOf(pend)); tab.pendingHttp = null
                              view.loadUrl(pend)
                              return
                          }
                          val bg = String.format("#%06X", 0xFFFFFF and P.bg)
                          val fg = String.format("#%06X", 0xFFFFFF and P.text)
                          val html = "<html><body style='background:$bg;color:$fg;font-family:sans-serif;padding:32px'>" +
                              "<h2>Không mở được trang</h2><p>${err.description}</p><p>Kiểm tra kết nối mạng rồi kéo tải lại.</p></body></html>"
                          view.loadDataWithBaseURL(req.url.toString(), html, "text/html", "utf-8", req.url.toString())
                      }
                  }

                  w.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, p: Int) {
                          tab.progress = p
                          if (p in 20..60) {
                              injectGuards(view, tab.url)
                              if (adOn && !exc.contains(hostOf(tab.url))) view.evaluateJavascript(AdBlock.cosmeticJs(adLevel), null)
                          }
                          if (tabs.getOrNull(cur) === tab) progressBar.scaleX = if (p in 1..99) p / 100f else 0f
                      }

                      override fun onReceivedTitle(view: WebView, title: String?) { if (title != null) tab.title = title }

                      override fun onReceivedIcon(view: WebView, icon: Bitmap?) { tab.icon = icon }

                      override fun onCreateWindow(view: WebView, isDialog: Boolean, isUserGesture: Boolean, resultMsg: Message): Boolean {
                          val host = hostOf(tab.url)
                          val now = System.currentTimeMillis()
                          if (popupBlock && !popExc.contains(host)) {
                              val block = !isUserGesture || now - lastWindowTs < 1500 || now - tab.lastTouch > 2500
                              if (block) {
                                  tab.popups++; blockedTotal++
                                  if (tabs.getOrNull(cur) === tab) {
                                      showPill("Đã chặn cửa sổ bật lên", "Cho phép") {
                                          val s = Store.popExc(this@MainActivity); if (host.isNotEmpty()) s.add(host)
                                          Store.setPopExc(this@MainActivity, s); popExc = s
                                          toast("Đã cho phép $host mở cửa sổ mới. Bấm lại liên kết.")
                                      }
                                  }
                                  return false
                              }
                          }
                          lastWindowTs = now
                          val nt = Tab()
                          nt.web = makeWeb(nt)
                          nt.opener = tab
                          tabs.add(nt)
                          cur = tabs.size - 1
                          showTab()
                          val tr = resultMsg.obj as WebView.WebViewTransport
                          tr.webView = nt.web
                          resultMsg.sendToTarget()
                          return true
                      }

                      override fun onShowCustomView(view: View, cb: CustomViewCallback) {
                          if (customView != null) { cb.onCustomViewHidden(); return }
                          customView = view; customCb = cb
                          root.addView(view, FrameLayout.LayoutParams(MATCH, MATCH))
                          view.setBackgroundColor(Color.BLACK)
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_FULL_SENSOR
                          fullscreen(true)
                      }

                      override fun onHideCustomView() { hideCustom() }

                      override fun onShowFileChooser(wv: WebView, cb: ValueCallback<Array<Uri>>, params: FileChooserParams): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          return try { startActivityForResult(params.createIntent(), 77); true } catch (e: Exception) { fileCb = null; false }
                      }

                      override fun onJsAlert(view: WebView, url: String, message: String, result: JsResult): Boolean {
                          dlg().setMessage(message).setPositiveButton("OK") { _, _ -> result.confirm() }.setOnCancelListener { result.cancel() }.show()
                          return true
                      }

                      override fun onJsConfirm(view: WebView, url: String, message: String, result: JsResult): Boolean {
                          dlg().setMessage(message).setPositiveButton("OK") { _, _ -> result.confirm() }
                              .setNegativeButton("Hủy") { _, _ -> result.cancel() }.setOnCancelListener { result.cancel() }.show()
                          return true
                      }
                  }

                  w.setDownloadListener { url, ua, cd, mime, _ ->
                      val path = url.substringBefore('?').lowercase()
                      val isVideo = (mime ?: "").startsWith("video/") || path.endsWith(".mp4") || path.endsWith(".webm") || path.endsWith(".mkv") || path.endsWith(".mov")
                      if (isVideo) startDownload(MediaItem(url, "MP4", tab.url), tab)
                      else {
                          try {
                              val r = DownloadManager.Request(Uri.parse(url))
                              if (!mime.isNullOrEmpty()) r.setMimeType(mime)
                              val ck = CookieManager.getInstance().getCookie(url)
                              if (!ck.isNullOrEmpty()) r.addRequestHeader("Cookie", ck)
                              if (!ua.isNullOrEmpty()) r.addRequestHeader("User-Agent", ua)
                              r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                              val fn = URLUtil.guessFileName(url, cd, mime)
                              r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fn)
                              (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(r)
                              toast("Đang tải: $fn")
                          } catch (e: Exception) { toast("Không tải được tệp này") }
                      }
                  }

                  w.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              tab.lastTouch = System.currentTimeMillis()
                              pullStartY = e.rawY
                              pullDy = 0f
                              pullCand = tabs.getOrNull(cur) === tab && overlays.isEmpty() && !w.canScrollVertically(-1)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              if (pullCand) {
                                  val dy = e.rawY - pullStartY
                                  if (dy < -dp(6)) { pullCand = false; hidePull() }
                                  else if (dy > dp(12)) {
                                      pullDy = dy
                                      pullIcon.visibility = View.VISIBLE
                                      pullIcon.alpha = (dy / dp(100)).coerceIn(0f, 1f)
                                      pullIcon.rotation = dy * 2f
                                      pullIcon.translationY = content.top + (dy * 0.4f).coerceAtMost(dp(70).toFloat()) - dp(30)
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              tab.lastTouch = System.currentTimeMillis()
                              if (pullCand && e.action == MotionEvent.ACTION_UP && pullDy > dp(100)) { w.reload(); toast("Đang làm mới...") }
                              pullCand = false
                              hidePull()
                          }
                      }
                      false
                  }
                  w.setOnLongClickListener {
                      val r = w.hitTestResult
                      val ex = r.extra
                      if ((r.type == WebView.HitTestResult.SRC_ANCHOR_TYPE || r.type == WebView.HitTestResult.SRC_IMAGE_ANCHOR_TYPE) && ex != null) {
                          dlg().setTitle(ex.take(80)).setItems(arrayOf("Mở trong tab mới", "Sao chép liên kết", "Chia sẻ liên kết")) { _, i ->
                              when (i) {
                                  0 -> newTab(ex, tab)
                                  1 -> copy(ex)
                                  2 -> shareText(ex)
                              }
                          }.show()
                          true
                      } else false
                  }
                  return w
              }

