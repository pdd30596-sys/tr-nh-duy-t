              private fun openSettings() {
                  val (f, body) = screen("Cài đặt")
                  val cats = listOf(
                      Triple(20, "Giao diện", "Chủ đề, cỡ chữ, hiệu ứng 3D"),
                      Triple(16, "Chung", "Tìm kiếm, trình duyệt mặc định"),
