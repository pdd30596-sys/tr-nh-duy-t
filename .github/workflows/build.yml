              fun setGlobal(c: Context, id: String, v: Boolean) = Store.setFlag(c, "x_$id", v)
              fun on(c: Context, host: String, id: String): Boolean {
                  val s = if (host.isEmpty()) -1 else Store.intVal(c, "xs_${host}_$id", -1)
                  return if (s >= 0) s == 1 else globalOn(c, id)
              }
              fun setSite(c: Context, host: String, id: String, v: Boolean) = Store.setIntVal(c, "xs_${host}_$id", if (v) 1 else 0)

              private fun styleJs(id: String, css: String): String =
                  "(function(){try{var i='luot-x-" + id + "';if(document.getElementById(i))return;var s=document.createElement('style');s.id=i;s.textContent=" +
                      JSONObject.quote(css) + ";(document.head||document.documentElement).appendChild(s);}catch(e){}})();"

              private const val READER = "header,nav,aside,footer,[role=banner],[role=navigation],[role=complementary],[class*=sidebar],[id*=sidebar],[class*=comment],[id*=comment],[class*=related],[class*=share],[class*=social],[class*=newsletter],[class*=banner]{display:none!important}" +
                  "html,body{background:#FBF8F1!important;color:#222!important}" +
