              private fun playUrl(m: MediaItem, t: Tab, ua: String) {
                  val i = Intent(this, PlayerActivity::class.java)
                  i.putExtra("url", m.url).putExtra("referer", m.referer).putExtra("title", t.title).putExtra("ua", ua)
                  startActivity(i)
              }

              // ---- tab 3D ----
              private fun snap(t: Tab) {
                  val w = t.web ?: return
                  if (w.width <= 0 || w.height <= 0) return
                  try {
                      val bmp = Bitmap.createBitmap(w.width / 3, w.height / 3, Bitmap.Config.RGB_565)
                      val c = Canvas(bmp)
                      c.scale(1f / 3f, 1f / 3f)
                      w.draw(c)
                      t.thumb = bmp
                  } catch (e: Exception) { }
              }

              private fun openTabs() {
                  snap(tabs[cur])
                  val f = FrameLayout(this)
                  f.setBackgroundColor(P.bg)
                  f.isClickable = true
                  val col = LinearLayout(this)
                  col.orientation = LinearLayout.VERTICAL
                  val head = LinearLayout(this)
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.setPadding(dp(20), dp(16), dp(12), dp(8))
                  val title = tv(this, "", 24f, P.text, true)
                  head.addView(title, lp(0, WRAP, 1f))
                  val done = tv(this, "Xong", 14f, P.accent, true)
                  done.gravity = Gravity.CENTER; done.minHeight = dp(48); done.setPadding(dp(12), 0, dp(12), 0)
                  done.setOnClickListener { popOverlay() }
                  head.addView(done)
                  col.addView(head)
                  val sv = ScrollView(this)
                  val list = LinearLayout(this)
                  list.orientation = LinearLayout.VERTICAL
                  list.setPadding(dp(24), dp(12), dp(24), dp(40))
                  sv.addView(list)
                  col.addView(sv, lp(MATCH, 0, 1f))
                  val add = btn(this, "Tab mới", P.accent, P.onAccent, 0) { popOverlay(); newTab() }
                  val ap = lp(MATCH, dp(52)); ap.setMargins(dp(20), dp(8), dp(20), dp(16))
                  col.addView(add, ap)
                  f.addView(col, FrameLayout.LayoutParams(MATCH, MATCH))

                  fun render() {
                      title.text = "${tabs.size} tab"
                      list.removeAllViews()
                      var row: LinearLayout? = null
                      for (i in tabs.indices) {
                          if (i % 2 == 0) {
                              row = LinearLayout(this)
                              row.orientation = LinearLayout.HORIZONTAL
                              val rp = lp(MATCH, WRAP)
                              if (i > 0) rp.topMargin = dp(18)
                              list.addView(row, rp)
                          }
                          val t = tabs[i]
                          val cell = LinearLayout(this)
                          cell.orientation = LinearLayout.VERTICAL
                          val frame = FrameLayout(this)
                          frame.background = rr(this, P.surface, 18, if (i == cur) P.accent else P.line)
                          frame.clipToOutline = true
                          frame.outlineProvider = android.view.ViewOutlineProvider.BACKGROUND
                          val letter = hostOf(t.url).removePrefix("www.").take(1).uppercase()
                          if (t.thumb != null) {
                              val img = ImageView(this)
                              img.scaleType = ImageView.ScaleType.CENTER_CROP
                              img.setImageBitmap(t.thumb)
                              frame.addView(img, FrameLayout.LayoutParams(MATCH, MATCH))
                          } else if (t.url.isEmpty()) {
                              val hi = IconView(this, 2)
                              hi.color = P.accent
                              frame.addView(hi, FrameLayout.LayoutParams(dp(56), dp(56), Gravity.CENTER))
                          } else {
                              val big = tv(this, letter, 38f, P.accent, true)
                              big.gravity = Gravity.CENTER
                              frame.addView(big, FrameLayout.LayoutParams(MATCH, MATCH))
                          }
                          val x = IconView(this, 5)
                          x.color = P.text
                          x.contentDescription = "Đóng tab"
                          x.background = rr(this, (P.bg and 0x00FFFFFF) or (0xCC shl 24), 17)
                          x.setOnClickListener { closeTab(i); render() }
                          val xp = FrameLayout.LayoutParams(dp(34), dp(34), Gravity.TOP or Gravity.END)
                          xp.setMargins(0, dp(6), dp(6), 0)
                          frame.addView(x, xp)
                          frame.setOnClickListener { cur = i; popOverlay() }
                          cell.addView(frame, lp(MATCH, dp(190)))
                          val tr = LinearLayout(this)
                          tr.gravity = Gravity.CENTER_VERTICAL
                          tr.setPadding(dp(2), dp(8), dp(2), 0)
                          val ic = t.icon
                          if (ic != null) {
                              val iv = ImageView(this)
                              iv.scaleType = ImageView.ScaleType.FIT_CENTER
                              iv.setImageBitmap(ic)
                              tr.addView(iv, lp(dp(20), dp(20)))
                          } else if (t.url.isEmpty()) {
                              val hi = IconView(this, 2)
                              hi.color = P.accent
                              tr.addView(hi, lp(dp(20), dp(20)))
                          } else {
                              val lc = tv(this, letter, 11f, P.onAccent, true)
                              lc.gravity = Gravity.CENTER
                              lc.background = rr(this, P.accent, 10)
                              tr.addView(lc, lp(dp(20), dp(20)))
                          }
                          val nm = tv(this, if (t.url.isEmpty()) "Trang chủ" else t.title.ifBlank { hostOf(t.url) }, 13f, P.text, i == cur)
                          nm.maxLines = 1
                          nm.ellipsize = android.text.TextUtils.TruncateAt.END
                          val np = lp(0, WRAP, 1f); np.leftMargin = dp(8)
                          tr.addView(nm, np)
                          cell.addView(tr)
                          val cp = lp(0, WRAP, 1f)
                          if (i % 2 == 1) cp.leftMargin = dp(14)
                          row!!.addView(cell, cp)
                      }
                      if (tabs.size % 2 == 1) {
                          val sp = lp(0, 1, 1f); sp.leftMargin = dp(14)
                          row!!.addView(View(this), sp)
                      }
                  }
                  render()
                  pushOverlay(f)
              }

