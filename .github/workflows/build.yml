              // ---- dịch trang ----
              private val transNames = arrayOf("Tiếng Việt", "English", "中文", "日本語", "한국어", "Français", "Español", "Deutsch")
              private val transCodes = arrayOf("vi", "en", "zh-CN", "ja", "ko", "fr", "es", "de")

              private fun isTranslated(url: String) = hostOf(url).endsWith(".translate.goog")

              private fun translateUrl(url: String, lang: String): String? {
                  return try {
                      val u = Uri.parse(url)
                      val host = u.host ?: return null
                      if (u.port != -1 || (u.scheme != "http" && u.scheme != "https")) return null
                      val th = host.replace("-", "--").replace(".", "-") + ".translate.goog"
                      val path = u.encodedPath ?: "/"
                      val q = u.encodedQuery
                      "https://" + th + path + (if (q != null) "?$q&" else "?") + "_x_tr_sl=auto&_x_tr_tl=$lang&_x_tr_hl=$lang&_x_tr_pto=wapp"
                  } catch (e: Exception) { null }
              }

              private fun originalUrl(url: String): String? {
                  return try {
                      val u = Uri.parse(url)
                      val h = u.host ?: return null
                      if (!h.endsWith(".translate.goog")) return null
                      val oh = h.removeSuffix(".translate.goog").replace("--", "\u0000").replace("-", ".").replace("\u0000", "-")
                      val q = (u.encodedQuery ?: "").split("&").filter { it.isNotEmpty() && !it.startsWith("_x_tr_") }.joinToString("&")
                      "https://" + oh + (u.encodedPath ?: "/") + (if (q.isNotEmpty()) "?$q" else "")
                  } catch (e: Exception) { null }
              }

              private fun translateDialog() {
                  val t = tabs[cur]
                  if (t.web == null || t.url.isEmpty()) return
                  dlg().setTitle("Dịch trang sang").setItems(transNames) { _, i ->
                      Store.setTransLang(this, i)
                      val base = originalUrl(t.url) ?: t.url
                      val tu = translateUrl(base, transCodes[i])
                      if (tu == null) toast("Trang này không dịch được") else { t.web?.loadUrl(tu); toast("Đang dịch sang " + transNames[i] + "...") }
                  }.show()
              }

              private fun showOriginal() {
                  val t = tabs[cur]
                  val o = originalUrl(t.url) ?: return
                  t.web?.loadUrl(o)
              }

              private fun toggleDesktop() {
                  val t = tabs[cur]
                  val w = t.web ?: return
                  t.desktop = !t.desktop
                  w.settings.userAgentString = if (t.desktop) DESKTOP_UA else t.mobileUa
                  w.settings.useWideViewPort = true
                  w.settings.loadWithOverviewMode = true
                  w.reload()
                  toast(if (t.desktop) "Đang xem bản máy tính" else "Đã về bản di động")
              }

              private fun showPill(msg: String, action: String?, onAction: (() -> Unit)?) {
                  pill?.let { root.removeView(it) }
                  val t = tv(this, if (action != null) "$msg  ·  $action" else msg, 13f, P.text, true)
                  t.background = rr(this, P.surface, 22, P.accent)
                  t.setPadding(dp(16), dp(12), dp(16), dp(12))
                  t.elevation = dp(8).toFloat()
                  t.setOnClickListener { onAction?.invoke(); root.removeView(t); if (pill === t) pill = null }
                  val p = FrameLayout.LayoutParams(WRAP, WRAP, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL)
                  p.bottomMargin = dp(80)
                  root.addView(t, p)
                  pill = t
                  main.postDelayed({ if (pill === t) { root.removeView(t); pill = null } }, 4000)
              }

              private fun hideCustom() {
                  val v = customView ?: return
                  root.removeView(v)
                  customView = null
                  customCb?.onCustomViewHidden()
                  customCb = null
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                  fullscreen(false)
              }

              @Suppress("DEPRECATION")
              private fun fullscreen(on: Boolean) {
                  if (on) window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  else window.decorView.systemUiVisibility = if (P.dark) 0 else (View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 77) {
                      fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCb = null
                  } else if (requestCode == 78) {
                      val u = data?.data
                      if (resultCode == Activity.RESULT_OK && u != null) {
                          Thread {
                              val ok = Wall.saveImage(this, u)
                              runOnUiThread {
                                  if (ok) { Store.setWpMode(this, 2); wpRefresh?.invoke(); showTab() } else toast("Không đọc được ảnh này")
                              }
                          }.start()
                      }
                  } else if (requestCode == 79) {
                      val u = data?.data
                      if (resultCode == Activity.RESULT_OK && u != null) {
                          try {
                              val txt = contentResolver.openInputStream(u)?.use { it.readBytes().take(500000).toByteArray().toString(Charsets.UTF_8) } ?: ""
                              if (txt.isBlank()) toast("File trống") else scriptDialog(null, txt)
                          } catch (e: Exception) { toast("Không đọc được file") }
                      }
                  } else super.onActivityResult(requestCode, resultCode, data)
              }

              // ================= bắt link video =================
              private fun sniff(t: Tab, url: String) {
                  val path = url.substringBefore('#').substringBefore('?').lowercase()
                  val type = when {
                      path.endsWith(".m3u8") -> "HLS"
                      path.endsWith(".mp4") || path.endsWith(".m4v") || path.endsWith(".mov") -> "MP4"
                      path.endsWith(".webm") -> "WEBM"
                      path.endsWith(".mkv") -> "MKV"
                      path.endsWith(".flv") -> "FLV"
                      path.endsWith(".mpd") -> "DASH"
                      else -> return
                  }
                  val ref = t.url
                  main.post { addMedia(t, url, type, ref) }
              }

              private fun addMedia(t: Tab, url: String, type: String, ref: String?) {
                  if (t.media.any { it.url == url }) return
                  t.media.add(MediaItem(url, type, ref))
                  if (tabs.getOrNull(cur) === t) updateBubble()
              }

              private fun scanVideos(t: Tab) {
                  val w = t.web ?: return
                  w.evaluateJavascript("(function(){var r=[];document.querySelectorAll('video,video source').forEach(function(v){var s=v.currentSrc||v.src;if(s&&s.indexOf('http')===0)r.push(s);});return r.join('\\n');})()") { v ->
                      try {
                          val s = JSONTokener(v ?: "null").nextValue()
                          if (s is String && s.isNotBlank()) {
                              for (u in s.split("\n")) {
                                  val p = u.substringBefore('#').substringBefore('?').lowercase()
                                  val ty = when {
                                      p.endsWith(".m3u8") -> "HLS"
                                      p.endsWith(".webm") -> "WEBM"
                                      p.endsWith(".mpd") -> "DASH"
                                      else -> "MP4"
                                  }
                                  addMedia(t, u, ty, t.url)
                              }
                          }
                      } catch (e: Exception) { }
                  }
              }

              private fun sanitize(s: String): String {
                  val x = s.replace(Regex("[\\\\/:*?\"<>|\\n\\r\\t]"), " ").replace(Regex("\\s+"), " ").trim()
                  return if (x.length > 60) x.substring(0, 60).trim() else x
              }

              private fun requestNotif() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 5)
              }

              private fun startDownload(m: MediaItem, tab: Tab) {
                  requestNotif()
                  val ua = tab.web?.settings?.userAgentString ?: ""
                  val base = sanitize(if (tab.title.isBlank() || tab.title == "Tab mới") hostOf(m.url) else tab.title).ifBlank { "video" }
                  when (m.type) {
                      "DASH" -> toast("Định dạng DASH (.mpd) chưa hỗ trợ tải")
                      "HLS" -> {
                          toast("Đang đọc danh sách phát...")
                          Thread {
                              try {
                                  val text = Downloader.fetchText(m.url, m.referer, ua)
                                  val vars = Downloader.parseVariants(text, m.url)
                                  runOnUiThread {
                                      if (vars.size <= 1) {
                                          Downloader.enqueue(this, "$base.ts", vars.firstOrNull()?.url ?: m.url, m.referer, ua, true)
                                          toast("Đã thêm vào Tải xuống")
                                      } else {
                                          val labels = vars.map { (it.res ?: "?") + " · " + (it.bw / 1000) + " kbps" }.toTypedArray()
                                          dlg().setTitle("Chọn chất lượng").setItems(labels) { _, i ->
                                              Downloader.enqueue(this, "$base (${vars[i].res ?: (vars[i].bw / 1000).toString() + "k"}).ts", vars[i].url, m.referer, ua, true)
                                              toast("Đã thêm vào Tải xuống")
                                          }.show()
                                      }
                                  }
                              } catch (e: Exception) {
                                  runOnUiThread { toast("Không đọc được: " + (e.message ?: "lỗi mạng")) }
                              }
                          }.start()
                      }
                      else -> {
                          val ext = when (m.type) { "WEBM" -> ".webm"; "MKV" -> ".mkv"; "FLV" -> ".flv"; else -> ".mp4" }
                          Downloader.enqueue(this, base + ext, m.url, m.referer, ua, false)
                          toast("Đã thêm vào Tải xuống")
                      }
                  }
              }

              // ================= hình nền =================
              private var wpRefresh: (() -> Unit)? = null
              private var extRefresh: (() -> Unit)? = null
              private var extTab = 0

              private fun openWallpaper() {
                  val (f, body) = screen("Hình nền")
                  f.tag = "wp"
                  fun render() {
                      body.removeAllViews()
                      val mode = Store.wpMode(this)

                      val pvHolder = FrameLayout(this)
                      fun buildPreview(): View {
                          val pv = FrameLayout(this)
                          pv.background = rr(this, P.surface, 20, P.line)
                          pv.clipToOutline = true
                          pv.outlineProvider = android.view.ViewOutlineProvider.BACKGROUND
                          val d = Wall.drawable(this)
                          if (d != null) {
                              val iv = ImageView(this)
                              iv.scaleType = ImageView.ScaleType.CENTER_CROP
                              iv.setImageDrawable(d)
                              pv.addView(iv, FrameLayout.LayoutParams(MATCH, MATCH))
                          }
                          val col = if (d != null) Color.WHITE else P.text
                          val g = tv(this, "Chào buổi sáng", 13f, col, true)
                          val gp = FrameLayout.LayoutParams(WRAP, WRAP, Gravity.TOP or Gravity.START)
                          gp.setMargins(dp(18), dp(18), 0, 0)
                          pv.addView(g, gp)
                          val pill = tv(this, "Tìm kiếm hoặc nhập địa chỉ", 12f, 0xFF4F6B82.toInt())
                          pill.gravity = Gravity.CENTER_VERTICAL
                          pill.setPadding(dp(14), 0, dp(14), 0)
                          pill.background = rr(this, 0xE6FFFFFF.toInt(), 18)
                          val pp = FrameLayout.LayoutParams(MATCH, dp(36), Gravity.BOTTOM)
                          pp.setMargins(dp(18), 0, dp(18), dp(18))
                          pv.addView(pill, pp)
                          return pv
                      }
                      fun refreshPreview() { pvHolder.removeAllViews(); pvHolder.addView(buildPreview(), FrameLayout.LayoutParams(MATCH, MATCH)) }
                      refreshPreview()
                      val pvp = lp(MATCH, dp(190)); pvp.topMargin = dp(8)
                      body.addView(pvHolder, pvp)

                      sSec(body, "Nền có sẵn")
                      val n = Wall.presets.size + 1
                      var row: LinearLayout? = null
                      for (i in 0 until n) {
                          if (i % 3 == 0) {
                              row = LinearLayout(this)
                              val rp = lp(MATCH, WRAP); rp.topMargin = dp(10)
                              body.addView(row, rp)
                          }
                          val tile = FrameLayout(this)
                          if (i < Wall.presets.size) {
                              val sel = mode == 1 && Store.wpPreset(this) == i
                              val g = Wall.gradient(Wall.presets[i])
                              g.cornerRadius = dp(16).toFloat()
                              g.setStroke(if (sel) dp(2) else dp(1), if (sel) P.accent else P.line)
                              tile.background = g
                              val nm = tv(this, Wall.presets[i].name, 11f, Color.WHITE, true)
                              val np = FrameLayout.LayoutParams(WRAP, WRAP, Gravity.BOTTOM or Gravity.START)
                              np.setMargins(dp(10), 0, dp(10), dp(8))
                              tile.addView(nm, np)
                              tile.setOnClickListener { Store.setWpMode(this, 1); Store.setWpPreset(this, i); render() }
                          } else {
                              tile.background = rr(this, if (mode == 2) (P.accent and 0x00FFFFFF) or 0x33000000 else P.surface, 16, P.accent)
                              val c = LinearLayout(this)
                              c.orientation = LinearLayout.VERTICAL
                              c.gravity = Gravity.CENTER
                              val im = ImageView(this)
                              im.setImageResource(R.drawable.ic_m_img)
                              im.setColorFilter(P.accent)
                              c.addView(im, lp(dp(22), dp(22)))
                              val lb = tv(this, "Ảnh của bạn", 11f, P.accent, true)
                              val lq = lp(WRAP, WRAP); lq.topMargin = dp(4)
                              c.addView(lb, lq)
                              tile.addView(c, FrameLayout.LayoutParams(MATCH, MATCH))
                              tile.setOnClickListener {
                                  try {
                                      val i2 = Intent(Intent.ACTION_OPEN_DOCUMENT)
                                      i2.addCategory(Intent.CATEGORY_OPENABLE)
                                      i2.type = "image/*"
                                      startActivityForResult(i2, 78)
                                  } catch (e: Exception) { toast("Không mở được thư viện ảnh") }
                              }
                          }
                          val q = lp(0, dp(84), 1f)
                          if (i % 3 > 0) q.leftMargin = dp(10)
                          row!!.addView(tile, q)
                      }
                      val rem = n % 3
                      if (rem != 0) for (k in 0 until 3 - rem) { val q = lp(0, 1, 1f); q.leftMargin = dp(10); row!!.addView(View(this), q) }

                      fun slider(title: String, value: Int, max: Int, enabled: Boolean, done: (Int) -> Unit) {
                          val head = LinearLayout(this)
                          head.gravity = Gravity.CENTER_VERTICAL
                          head.addView(tv(this, title, 14f, if (enabled) P.text else P.muted, true), lp(0, WRAP, 1f))
                          val vt = tv(this, "$value%", 13f, P.muted)
                          head.addView(vt)
                          val hp = lp(MATCH, WRAP); hp.topMargin = dp(18)
                          body.addView(head, hp)
                          val sb = SeekBar(this)
                          sb.max = max
                          sb.progress = value
                          sb.isEnabled = enabled
                          sb.progressTintList = android.content.res.ColorStateList.valueOf(P.accent)
                          sb.thumbTintList = android.content.res.ColorStateList.valueOf(P.accent)
                          sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) { vt.text = "$p%" }
                              override fun onStartTrackingTouch(s: SeekBar?) {}
                              override fun onStopTrackingTouch(s: SeekBar?) { done(sb.progress); refreshPreview() }
                          })
                          body.addView(sb, lp(MATCH, WRAP))
                      }
                      slider("Độ mờ", Store.wpBlur(this), 100, mode == 2) { Store.setWpBlur(this, it) }
                      if (mode != 2) body.addView(tv(this, "Độ mờ chỉ áp dụng cho ảnh của bạn.", 12f, P.muted))
                      slider("Độ tối", Store.wpDim(this), 80, mode != 0) { Store.setWpDim(this, it) }

                      if (mode != 0) {
                          val rb = btn(this, "Gỡ hình nền", P.surface, P.text, P.line) { Store.setWpMode(this, 0); render() }
                          val rp = lp(MATCH, WRAP); rp.topMargin = dp(24)
                          body.addView(rb, rp)
                      }
                      body.addView(tv(this, "Hình nền chỉ hiện ở trang chủ (tab mới). Trang web vẫn hiển thị bình thường. Ảnh được chép vào bộ nhớ app, không tải lên đâu cả.", 12f, P.muted).also { it.setPadding(0, dp(16), 0, 0) })
                  }
                  wpRefresh = { render() }
                  render()
                  pushOverlay(f)
              }

              // ================= tiện ích =================
              private fun injectExt(view: WebView, url: String) {
                  if (!url.startsWith("http")) return
                  val js = Ext.js(this, hostOf(url))
                  if (js.isNotEmpty()) view.evaluateJavascript(js, null)
              }

              private fun injectScripts(view: WebView, url: String) {
                  if (!url.startsWith("http")) return
                  for (j in Ext.scriptJs(this, hostOf(url))) view.evaluateJavascript(j, null)
              }

              private fun smallBtn(label: String, color: Int, a: () -> Unit): TextView {
                  val b = tv(this, label, 12f, color, true)
                  b.gravity = Gravity.CENTER
                  b.setPadding(dp(12), 0, dp(12), 0)
                  b.minHeight = dp(32)
                  b.background = rr(this, P.bg, 16, P.line)
                  b.setOnClickListener { a() }
                  return b
              }

