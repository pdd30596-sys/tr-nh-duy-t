                  "img,video{max-width:100%!important;height:auto!important}"
              private const val DARK = "html{filter:invert(1) hue-rotate(180deg)!important;background:#fff!important}" +
                  "img,video,picture,canvas,svg{filter:invert(1) hue-rotate(180deg)!important}"
              private const val COOKIE = "#onetrust-banner-sdk,#onetrust-consent-sdk,.onetrust-pc-dark-filter,#CybotCookiebotDialog,#CybotCookiebotDialogBodyUnderlay,.fc-consent-root," +
                  "#cookie-banner,#cookie-notice,#cookieNotice,#cookie-consent,#cookieconsent,.cookie-banner,.cookie-notice,.cookie-consent,.cookie-popup,.cc-window,.cc-banner," +
                  "#gdpr-cookie-notice,.gdpr-banner,[id*=\"cookie-banner\"],[class*=\"cookie-banner\"],[id*=\"cookie-consent\"],[class*=\"cookie-consent\"],[class*=\"CookieConsent\"]," +
                  "[id*=\"cookiebanner\"],[class*=\"cookiebanner\"],#truste-consent-track,.truste_overlay,#qc-cmp2-container,[id^=\"sp_message_container\"]{display:none!important}" +
                  "html,body{overflow:auto!important}"
              private const val UNLOCK_CSS = "*{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important}"
              private const val UNLOCK_JS = "(function(){try{if(window.__luotu)return;window.__luotu=1;['copy','cut','paste','contextmenu','selectstart','dragstart'].forEach(function(e){document.addEventListener(e,function(ev){ev.stopImmediatePropagation();},true);});}catch(e){}})();"

              /** JS của các tiện ích có sẵn đang bật cho trang này. */
              fun js(c: Context, host: String): String {
                  val sb = StringBuilder()
                  if (on(c, host, "reader")) sb.append(styleJs("reader", READER))
                  if (on(c, host, "dark")) sb.append(styleJs("dark", DARK))
                  if (on(c, host, "cookie")) sb.append(styleJs("cookie", COOKIE))
                  if (on(c, host, "unlock")) sb.append(styleJs("unlock", UNLOCK_CSS)).append(UNLOCK_JS)
                  return sb.toString()
              }

              // ---- userscript ----
              fun scripts(c: Context): MutableList<UScript> {
                  val out = ArrayList<UScript>()
                  for (line in Store.str(c, "us", "").split("\n")) {
                      val p = line.split("\t")
                      if (p.size == 4 && p[0].isNotEmpty()) out.add(UScript(p[0], p[1], p[2] == "1", p[3]))
                  }
                  return out
              }

              private fun saveIdx(c: Context, l: List<UScript>) {
                  Store.setStr(c, "us", l.joinToString("\n") { "${it.id}\t${it.name.replace('\t', ' ').replace('\n', ' ')}\t${if (it.enabled) "1" else "0"}\t${it.match.replace('\t', ' ').replace('\n', ' ')}" })
              }

              fun newId(): String = java.lang.Long.toString(System.currentTimeMillis(), 36)

              fun code(c: Context, id: String): String = try { File(c.filesDir, "us_$id.js").readText() } catch (e: Exception) { "" }

              fun save(c: Context, s: UScript, code: String) {
                  try { File(c.filesDir, "us_${s.id}.js").writeText(code) } catch (e: Exception) { return }
                  val l = scripts(c)
                  val i = l.indexOfFirst { it.id == s.id }
                  if (i >= 0) l[i] = s else l.add(s)
                  saveIdx(c, l)
              }

              fun setEnabled(c: Context, id: String, v: Boolean) {
                  val l = scripts(c)
                  l.firstOrNull { it.id == id }?.enabled = v
                  saveIdx(c, l)
              }

              fun remove(c: Context, id: String) {
                  try { File(c.filesDir, "us_$id.js").delete() } catch (e: Exception) { }
                  saveIdx(c, scripts(c).filter { it.id != id })
              }

              private fun hostMatches(pattern: String, host: String): Boolean {
                  val p = pattern.trim().lowercase()
                  if (p.isEmpty()) return false
                  if (p == "*") return true
                  if (p.startsWith("*.")) { val b = p.substring(2); return host == b || host.endsWith(".$b") }
                  return host == p || host.endsWith(".$p")
              }

              fun matches(s: UScript, host: String): Boolean =
                  s.match.split(',', ' ', '\n').any { hostMatches(it, host) }

              fun scriptJs(c: Context, host: String): List<String> {
                  val out = ArrayList<String>()
                  for (s in scripts(c)) {
                      if (!s.enabled || !matches(s, host)) continue
                      val code = code(c, s.id)
                      if (code.isBlank()) continue
                      out.add("(function(){try{if(window['__lus_" + s.id + "'])return;window['__lus_" + s.id + "']=1;\n" + code + "\n}catch(e){}})();")
                  }
                  return out
              }

              private fun patToHost(p: String): String {
                  var s = p.trim()
                  val i = s.indexOf("://")
                  if (i >= 0) s = s.substring(i + 3)
                  s = s.substringBefore('/').substringBefore(':')
                  if (s != "*" && s.startsWith("*") && !s.startsWith("*.")) s = s.trim('*')
                  return s.trimEnd('*')
              }

              /** Đọc tên và trang áp dụng từ phần đầu script (// @name, // @match, // @include). */
              fun parseHeader(code: String): Pair<String, String> {
                  var name = ""
                  val hosts = ArrayList<String>()
                  val re = Regex("^\\s*//\\s*@(name|match|include)\\s+(.+?)\\s*$")
                  for (line in code.lineSequence().take(60)) {
                      val m = re.find(line) ?: continue
                      if (m.groupValues[1] == "name") { if (name.isEmpty()) name = m.groupValues[2] }
                      else { val h = patToHost(m.groupValues[2]); if (h.isNotEmpty()) hosts.add(h) }
                  }
                  return Pair(name, hosts.distinct().joinToString(","))
              }
          }
