                          r.addView(x, lp(dp(44), dp(44)))
                          excBox.addView(r)
                      }
                  }
                  renderExc()
                  body.addView(excBox)

                  sSec(body, "Cửa sổ bật lên")
                  sSw(body, "Chặn popup và tự mở tab mới", "Chặn trang tự mở tab, cửa sổ quảng cáo hoặc tự mở app khác khi bạn chưa bấm", popupBlock) { Store.setPopupBlock(this, it); popupBlock = it }
                  val popBox = LinearLayout(this)
                  popBox.orientation = LinearLayout.VERTICAL
                  fun renderPop() {
                      popBox.removeAllViews()
