              // ---- dịch trang ----
              private val transNames = arrayOf("Tiếng Việt", "English", "中文", "日本語", "한국어", "Français", "Español", "Deutsch")
              private val transCodes = arrayOf("vi", "en", "zh-CN", "ja", "ko", "fr", "es", "de")

              private fun isTranslated(url: String) = hostOf(url).endsWith(".translate.goog")

              private fun translateUrl(url: String, lang: String): String? {
                  return try {
                      val u = Uri.parse(url)
                      val host = u.host ?: return null
                      if (u.port != -1 || (u.scheme != "http" && u.scheme != "https")) return null
                      val th = host.replace("-", "--").replace(".", "-") + ".translate.goog"
                      val path = u.encodedPath ?: "/"
                      val q = u.encodedQuery
                      "https://" + th + path + (if (q != null) "?$q&" else "?") + "_x_tr_sl=auto&_x_tr_tl=$lang&_x_tr_hl=$lang&_x_tr_pto=wapp"
                  } catch (e: Exception) { null }
              }

              private fun originalUrl(url: String): String? {
                  return try {
                      val u = Uri.parse(url)
                      val h = u.host ?: return null
                      if (!h.endsWith(".translate.goog")) return null
                      val oh = h.removeSuffix(".translate.goog").replace("--", "\u0000").replace("-", ".").replace("\u0000", "-")
                      val q = (u.encodedQuery ?: "").split("&").filter { it.isNotEmpty() && !it.startsWith("_x_tr_") }.joinToString("&")
                      "https://" + oh + (u.encodedPath ?: "/") + (if (q.isNotEmpty()) "?$q" else "")
                  } catch (e: Exception) { null }
              }

              private fun translateDialog() {
                  val t = tabs[cur]
