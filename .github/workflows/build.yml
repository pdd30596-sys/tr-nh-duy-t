                          r.addView(tv(this, h, 14f, P.text), lp(0, WRAP, 1f))
                          val x = IconView(this, 5); x.color = P.muted
                          x.setOnClickListener { val s = Store.popExc(this); s.remove(h); Store.setPopExc(this, s); popExc = s; renderPop() }
                          r.addView(x, lp(dp(44), dp(44)))
