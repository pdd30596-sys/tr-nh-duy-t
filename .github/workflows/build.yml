          package vn.luot.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.net.Uri
          import java.io.File

          class WallPreset(val name: String, val colors: IntArray)

          object Wall {
              val presets = listOf(
                  WallPreset("Hoàng hôn", intArrayOf(0xFFFF9A6B.toInt(), 0xFFC2477A.toInt(), 0xFF2B2A5E.toInt())),
                  WallPreset("Biển đêm", intArrayOf(0xFF2FB5A0.toInt(), 0xFF145A7A.toInt(), 0xFF0A2540.toInt())),
                  WallPreset("Rừng sớm", intArrayOf(0xFF7BC47F.toInt(), 0xFF1E5F4B.toInt(), 0xFF0F2E2E.toInt())),
                  WallPreset("Cực quang", intArrayOf(0xFF5EE0B5.toInt(), 0xFF6B5BFF.toInt(), 0xFF1A1240.toInt())),
                  WallPreset("Than đá", intArrayOf(0xFF3A4552.toInt(), 0xFF1B2733.toInt(), 0xFF0B1622.toInt()))
              )

              private var cacheKey = ""
              private var cacheBmp: Bitmap? = null

              private fun file(ctx: Context) = File(ctx.filesDir, "wallpaper.jpg")

              fun gradient(p: WallPreset): GradientDrawable =
                  GradientDrawable(GradientDrawable.Orientation.TL_BR, p.colors)

              /** Nền trang chủ (đã gồm độ tối). null nếu không dùng hình nền. */
              fun drawable(ctx: Context): Drawable? {
                  val mode = Store.wpMode(ctx)
                  if (mode == 0) return null
                  val base: Drawable = if (mode == 2) {
                      val b = bitmap(ctx) ?: return null
                      BitmapDrawable(ctx.resources, b)
                  } else {
                      gradient(presets[Store.wpPreset(ctx).coerceIn(0, presets.size - 1)])
                  }
                  val a = (Store.wpDim(ctx).coerceIn(0, 80) * 255 / 100)
                  return LayerDrawable(arrayOf(base, ColorDrawable(a shl 24)))
              }

              private fun bitmap(ctx: Context): Bitmap? {
                  val f = file(ctx)
                  if (!f.exists()) return null
                  val dm = ctx.resources.displayMetrics
                  val tw = dm.widthPixels * 2 / 3
                  val th = dm.heightPixels * 2 / 3
                  val blur = Store.wpBlur(ctx).coerceIn(0, 100)
                  val key = "${f.lastModified()}_${f.length()}_${tw}x${th}_$blur"
                  val c = cacheBmp
                  if (c != null && key == cacheKey && !c.isRecycled) return c
                  return try {
                      val o = BitmapFactory.Options()
                      o.inJustDecodeBounds = true
                      BitmapFactory.decodeFile(f.path, o)
                      var ss = 1
                      while (o.outWidth / (ss * 2) >= tw && o.outHeight / (ss * 2) >= th) ss *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = ss
                      val src = BitmapFactory.decodeFile(f.path, o2) ?: return null
                      val s = maxOf(tw / src.width.toFloat(), th / src.height.toFloat())
                      var out = Bitmap.createBitmap(tw, th, Bitmap.Config.ARGB_8888)
                      val m = Matrix()
                      m.postScale(s, s)
                      m.postTranslate((tw - src.width * s) / 2f, (th - src.height * s) / 2f)
                      Canvas(out).drawBitmap(src, m, Paint(Paint.FILTER_BITMAP_FLAG))
                      src.recycle()
                      if (blur > 0) {
                          val k = 1 + blur / 6
                          val small = Bitmap.createScaledBitmap(out, maxOf(1, tw / k), maxOf(1, th / k), true)
                          val big = Bitmap.createScaledBitmap(small, tw, th, true)
                          small.recycle()
                          out.recycle()
                          out = big
                      }
                      cacheBmp = out
                      cacheKey = key
                      out
                  } catch (e: Throwable) { null }
              }

              /** Chép ảnh người dùng chọn vào bộ nhớ app (thu nhỏ, JPEG). */
              fun saveImage(ctx: Context, uri: Uri): Boolean {
                  return try {
                      val o = BitmapFactory.Options()
                      o.inJustDecodeBounds = true
                      ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o) }
                      var ss = 1
                      while (o.outWidth / (ss * 2) >= 1600 && o.outHeight / (ss * 2) >= 1600) ss *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = ss
                      val b = ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o2) } ?: return false
                      file(ctx).outputStream().use { b.compress(Bitmap.CompressFormat.JPEG, 90, it) }
                      b.recycle()
                      cacheBmp = null
                      cacheKey = ""
                      true
                  } catch (e: Throwable) { false }
              }
          }
