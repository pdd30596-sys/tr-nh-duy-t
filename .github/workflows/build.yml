              private fun openMenu() {
                  val (f, panel, _) = sheet()
                  val t = tabs[cur]
                  val onWeb = t.web != null && t.url.isNotEmpty()
                  fun row(label: String, a: () -> Unit) {
                      val r = tv(this, label, 15f, P.text)
                      r.gravity = Gravity.CENTER_VERTICAL
                      r.minHeight = dp(52)
                      r.setOnClickListener { popOverlay(); a() }
