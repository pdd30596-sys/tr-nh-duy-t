          const val WRAP = -2

          object P {
              var dark = true
              var bg = 0
              var surface = 0
              var line = 0
              var text = 0
              var muted = 0
              var accent = 0
              var video = 0
              var ok = 0
              var onAccent = 0
              var star = 0

              private fun c(s: String) = Color.parseColor(s)

              fun apply(d: Boolean) {
                  dark = d
                  if (d) {
                      bg = c("#0B1622"); surface = c("#132334"); line = c("#223A52"); text = c("#EAF3FB")
                      muted = c("#8FA9C0"); accent = c("#5BB4F5"); video = c("#FFA36B"); ok = c("#5EE0B5")
                      onAccent = c("#06223A"); star = c("#FFD166")
                  } else {
                      bg = c("#EEF6FC"); surface = c("#FFFFFF"); line = c("#D3E4F2"); text = c("#0F2A3F")
                      muted = c("#4F6B82"); accent = c("#1670B8"); video = c("#B8480E"); ok = c("#0B7A5A")
                      onAccent = c("#FFFFFF"); star = c("#C98A00")
                  }
              }
          }

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density + 0.5f).toInt()

          fun rr(ctx: Context, color: Int, rDp: Int, strokeColor: Int = 0): GradientDrawable {
              val g = GradientDrawable()
              g.setColor(color)
              g.cornerRadius = ctx.dp(rDp).toFloat()
              if (strokeColor != 0) g.setStroke(1.coerceAtLeast(ctx.dp(1)), strokeColor)
              return g
          }

          fun tv(c: Context, s: String, sp: Float, color: Int, bold: Boolean = false): TextView {
              val t = TextView(c)
              t.text = s
              t.setTextColor(color)
              t.textSize = sp
              if (bold) t.typeface = Typeface.DEFAULT_BOLD
              return t
          }

          fun btn(c: Context, s: String, bg: Int, fg: Int, stroke: Int, onClick: () -> Unit): TextView {
              val t = tv(c, s, 14f, fg, true)
              t.gravity = Gravity.CENTER
              t.minHeight = c.dp(44)
              t.background = rr(c, bg, 12, stroke)
              t.setPadding(c.dp(12), 0, c.dp(12), 0)
              t.setOnClickListener { onClick() }
              return t
          }

          fun lp(w: Int, h: Int, weight: Float = 0f) = LinearLayout.LayoutParams(w, h, weight)

          fun styledSwitch(c: Context, on: Boolean, onChange: (Boolean) -> Unit): Switch {
              val s = Switch(c)
              s.isChecked = on
              val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
              s.trackTintList = ColorStateList(states, intArrayOf(P.ok, P.line))
              s.thumbTintList = ColorStateList(states, intArrayOf(Color.WHITE, Color.parseColor("#CBD5E1")))
              s.setOnCheckedChangeListener { _, v -> onChange(v) }
              return s
          }

          fun segmented(c: Context, opts: List<String>, sel: Int, onSel: (Int) -> Unit): LinearLayout {
              val row = LinearLayout(c)
              row.orientation = LinearLayout.HORIZONTAL
              val views = ArrayList<TextView>()
              fun paint(s: Int) {
                  for (i in views.indices) {
                      val a = i == s
                      views[i].setTextColor(if (a) P.onAccent else P.text)
                      views[i].background = rr(c, if (a) P.accent else P.surface, 12, if (a) P.accent else P.line)
                  }
              }
              for (i in opts.indices) {
                  val t = tv(c, opts[i], 14f, P.text, true)
                  t.gravity = Gravity.CENTER
                  t.minHeight = c.dp(44)
                  t.setOnClickListener { paint(i); onSel(i) }
                  val p = lp(0, WRAP, 1f)
                  if (i > 0) p.leftMargin = c.dp(8)
                  row.addView(t, p)
                  views.add(t)
              }
              paint(sel)
              return row
          }

          /** Biểu tượng vẽ bằng canvas: 0 lùi, 1 tiến, 2 nhà, 3 tab, 4 ba chấm, 5 đóng, 6 khóa */
          class IconView(ctx: Context, var kind: Int) : View(ctx) {
              var color = 0
                  set(v) { field = v; invalidate() }
              var count = 0
                  set(v) { field = v; invalidate() }
              var filled = false
                  set(v) { field = v; invalidate() }
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(c: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val u = context.dp(1).toFloat()
                  p.color = color
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 2f * u
                  p.strokeCap = Paint.Cap.ROUND
                  p.strokeJoin = Paint.Join.ROUND
                  val path = Path()
                  when (kind) {
                      0 -> { path.moveTo(cx + 3 * u, cy + 6 * u); path.lineTo(cx - 3 * u, cy); path.lineTo(cx + 3 * u, cy - 6 * u); c.drawPath(path, p) }
                      1 -> { path.moveTo(cx - 3 * u, cy + 6 * u); path.lineTo(cx + 3 * u, cy); path.lineTo(cx - 3 * u, cy - 6 * u); c.drawPath(path, p) }
                      2 -> {
                          path.moveTo(cx - 9 * u, cy); path.lineTo(cx, cy - 8 * u); path.lineTo(cx + 9 * u, cy)
                          path.moveTo(cx - 6 * u, cy - 2 * u); path.lineTo(cx - 6 * u, cy + 8 * u); path.lineTo(cx + 6 * u, cy + 8 * u); path.lineTo(cx + 6 * u, cy - 2 * u)
                          c.drawPath(path, p)
                      }
                      3 -> {
                          c.drawRoundRect(RectF(cx - 11 * u, cy - 11 * u, cx + 11 * u, cy + 11 * u), 5 * u, 5 * u, p)
                          p.style = Paint.Style.FILL
                          p.textSize = 12 * u
                          p.textAlign = Paint.Align.CENTER
                          p.typeface = Typeface.DEFAULT_BOLD
                          c.drawText(count.toString(), cx, cy + 4.3f * u, p)
                      }
                      4 -> {
                          p.style = Paint.Style.FILL
                          c.drawCircle(cx, cy - 7 * u, 2f * u, p); c.drawCircle(cx, cy, 2f * u, p); c.drawCircle(cx, cy + 7 * u, 2f * u, p)
                      }
                      5 -> { path.moveTo(cx - 5 * u, cy - 5 * u); path.lineTo(cx + 5 * u, cy + 5 * u); path.moveTo(cx + 5 * u, cy - 5 * u); path.lineTo(cx - 5 * u, cy + 5 * u); c.drawPath(path, p) }
                      16 -> {
                          c.drawCircle(cx, cy, 4 * u, p)
                          for (k in 0 until 8) {
                              val ang = Math.PI / 4 * k
                              c.drawLine(cx + (7 * u * Math.cos(ang)).toFloat(), cy + (7 * u * Math.sin(ang)).toFloat(), cx + (10.5f * u * Math.cos(ang)).toFloat(), cy + (10.5f * u * Math.sin(ang)).toFloat(), p)
                          }
                          c.drawCircle(cx, cy, 7 * u, p)
                      }
                      17 -> {
                          path.moveTo(cx, cy - 10 * u); path.lineTo(cx + 9 * u, cy - 6 * u); path.lineTo(cx + 9 * u, cy + 1 * u)
                          path.quadTo(cx + 8 * u, cy + 8 * u, cx, cy + 11 * u); path.quadTo(cx - 8 * u, cy + 8 * u, cx - 9 * u, cy + 1 * u)
                          path.lineTo(cx - 9 * u, cy - 6 * u); path.close()
                          c.drawPath(path, p)
                          c.drawLine(cx - 3.5f * u, cy + 0.5f * u, cx - 0.5f * u, cy + 3.5f * u, p)
                          c.drawLine(cx - 0.5f * u, cy + 3.5f * u, cx + 4 * u, cy - 2.5f * u, p)
                      }
                      18 -> {
                          c.drawRoundRect(RectF(cx - 8 * u, cy - 2 * u, cx + 8 * u, cy + 9 * u), 3 * u, 3 * u, p)
                          c.drawArc(RectF(cx - 5 * u, cy - 10 * u, cx + 5 * u, cy), 180f, 180f, false, p)
                          p.style = Paint.Style.FILL
                          c.drawCircle(cx, cy + 3.5f * u, 1.6f * u, p)
                      }
                      19 -> {
                          c.drawCircle(cx, cy, 10 * u, p)
                          p.style = Paint.Style.FILL
                          c.drawCircle(cx, cy - 4.5f * u, 1.4f * u, p)
                          c.drawRoundRect(RectF(cx - 1.2f * u, cy - 1.5f * u, cx + 1.2f * u, cy + 6 * u), 1 * u, 1 * u, p)
                      }
                      20 -> {
                          c.drawCircle(cx, cy, 4.5f * u, p)
                          for (k in 0 until 8) {
                              val ang = Math.PI / 4 * k
                              c.drawLine(cx + (7.5f * u * Math.cos(ang)).toFloat(), cy + (7.5f * u * Math.sin(ang)).toFloat(), cx + (10.5f * u * Math.cos(ang)).toFloat(), cy + (10.5f * u * Math.sin(ang)).toFloat(), p)
                          }
                      }
                      13 -> {
                          p.strokeWidth = 2f * u
                          c.drawArc(RectF(cx - 8 * u, cy - 8 * u, cx + 8 * u, cy + 8 * u), -50f, 290f, false, p)
                          p.style = Paint.Style.FILL
                          path.moveTo(cx + 3 * u, cy - 12 * u); path.lineTo(cx + 10 * u, cy - 6 * u); path.lineTo(cx + 2 * u, cy - 3 * u); path.close()
                          c.drawPath(path, p)
                      }
                      14 -> { path.moveTo(cx - 6 * u, cy + 3 * u); path.lineTo(cx, cy - 3 * u); path.lineTo(cx + 6 * u, cy + 3 * u); c.drawPath(path, p) }
                      15 -> { path.moveTo(cx - 6 * u, cy - 3 * u); path.lineTo(cx, cy + 3 * u); path.lineTo(cx + 6 * u, cy - 3 * u); c.drawPath(path, p) }
                      12 -> {
                          for (k in 0 until 10) {
                              val r = if (k % 2 == 0) 10 * u else 4.4f * u
                              val ang = Math.PI / 5 * k - Math.PI / 2
                              val x = cx + (r * Math.cos(ang)).toFloat()
                              val y = cy + 1 * u + (r * Math.sin(ang)).toFloat()
                              if (k == 0) path.moveTo(x, y) else path.lineTo(x, y)
                          }
                          path.close()
                          p.style = if (filled) Paint.Style.FILL_AND_STROKE else Paint.Style.STROKE
                          p.strokeWidth = 1.6f * u
                          c.drawPath(path, p)
                      }
                      7 -> {
                          p.style = Paint.Style.FILL
                          path.moveTo(cx - 5 * u, cy - 8 * u); path.lineTo(cx - 5 * u, cy + 8 * u); path.lineTo(cx + 8 * u, cy); path.close()
                          c.drawPath(path, p)
                      }
                      8 -> {
                          p.style = Paint.Style.FILL
                          c.drawRoundRect(RectF(cx - 7 * u, cy - 8 * u, cx - 2 * u, cy + 8 * u), 1.5f * u, 1.5f * u, p)
                          c.drawRoundRect(RectF(cx + 2 * u, cy - 8 * u, cx + 7 * u, cy + 8 * u), 1.5f * u, 1.5f * u, p)
                      }
                      9 -> {
                          c.drawArc(RectF(cx - 10 * u, cy - 9 * u, cx + 10 * u, cy + 11 * u), 180f, 180f, false, p)
                          path.moveTo(cx, cy + 1 * u); path.lineTo(cx + 5 * u, cy - 5 * u)
                          c.drawPath(path, p)
                          p.style = Paint.Style.FILL
                          c.drawCircle(cx, cy + 1 * u, 1.8f * u, p)
                          c.drawLine(cx - 10 * u, cy + 1 * u, cx + 10 * u, cy + 1 * u, p)
                      }
                      10 -> {
                          c.drawRoundRect(RectF(cx - 10 * u, cy - 7 * u, cx + 10 * u, cy + 7 * u), 3 * u, 3 * u, p)
                          p.style = Paint.Style.FILL
                          c.drawRoundRect(RectF(cx + 1 * u, cy + 0 * u, cx + 8 * u, cy + 5 * u), 1.5f * u, 1.5f * u, p)
                      }
                      11 -> {
                          path.moveTo(cx - 3 * u, cy - 8 * u); path.lineTo(cx - 9 * u, cy - 8 * u); path.lineTo(cx - 9 * u, cy + 8 * u); path.lineTo(cx + 7 * u, cy + 8 * u); path.lineTo(cx + 7 * u, cy + 2 * u)
                          path.moveTo(cx + 1 * u, cy - 8 * u); path.lineTo(cx + 9 * u, cy - 8 * u); path.lineTo(cx + 9 * u, cy); path.moveTo(cx + 9 * u, cy - 8 * u); path.lineTo(cx - 1 * u, cy + 2 * u)
                          c.drawPath(path, p)
                      }
                      6 -> {
                          p.strokeWidth = 1.6f * u
                          c.drawRoundRect(RectF(cx - 5 * u, cy - 1 * u, cx + 5 * u, cy + 6 * u), 2 * u, 2 * u, p)
                          c.drawArc(RectF(cx - 3 * u, cy - 6 * u, cx + 3 * u, cy), 180f, 180f, false, p)
                      }
                  }
              }
          }

          /** Bong bóng nổi kiểu 3D: nền cầu có bóng, vệt sáng, nghiêng xoay nhẹ */
          class Bubble(ctx: Context) : View(ctx) {
              var count = 0
                  set(v) { field = v; invalidate() }
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val box = RectF()

              init {
                  outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(v: View, o: Outline) {
                          val ins = context.dp(8)
                          o.setOval(ins, ins, v.width - ins, v.height - ins)
                      }
                  }
                  elevation = context.dp(6).toFloat()
                  cameraDistance = 12000f * resources.displayMetrics.density
              }

              override fun onDraw(c: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = width / 2f - context.dp(8)
                  val ring = context.dp(2).toFloat()
                  // nền kính mờ
                  p.style = Paint.Style.FILL
                  p.shader = null
                  p.color = if (P.dark) 0xD10B1622.toInt() else 0xEBFFFFFF.toInt()
                  c.drawCircle(cx, cy, r, p)
                  // viền màu nhấn
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = ring
                  p.color = P.accent
                  c.drawCircle(cx, cy, r - ring / 2f, p)
                  // nút phát bo tròn góc
                  val s = r * 0.5f
                  path.reset()
                  path.moveTo(cx - s * 0.34f, cy - s * 0.62f)
                  path.lineTo(cx - s * 0.34f, cy + s * 0.62f)
                  path.lineTo(cx + s * 0.72f, cy)
                  path.close()
                  p.style = Paint.Style.FILL_AND_STROKE
                  p.strokeJoin = Paint.Join.ROUND
                  p.strokeWidth = r * 0.14f
                  p.color = P.accent
                  c.drawPath(path, p)
                  // huy hiệu số lượng
                  val label = count.toString()
                  p.style = Paint.Style.FILL
                  p.textSize = context.dp(11).toFloat()
                  p.typeface = Typeface.DEFAULT_BOLD
                  p.textAlign = Paint.Align.CENTER
                  val bh = context.dp(18).toFloat()
                  val bw = Math.max(bh, p.measureText(label) + context.dp(10))
                  val bx = Math.min(cx + r * 0.78f, width - bw / 2f - context.dp(1))
                  val by = cy - r * 0.78f
                  val gap = context.dp(2).toFloat()
                  box.set(bx - bw / 2f - gap, by - bh / 2f - gap, bx + bw / 2f + gap, by + bh / 2f + gap)
                  p.color = if (P.dark) P.bg else Color.WHITE
                  c.drawRoundRect(box, box.height() / 2f, box.height() / 2f, p)
                  box.set(bx - bw / 2f, by - bh / 2f, bx + bw / 2f, by + bh / 2f)
                  p.color = P.accent
                  c.drawRoundRect(box, bh / 2f, bh / 2f, p)
                  p.color = P.onAccent
                  val fm = p.fontMetrics
                  c.drawText(label, bx, by - (fm.ascent + fm.descent) / 2f, p)
              }
          }
