              // ---- media sheet ----
              private fun openMedia() {
                  val t = tabs[cur]
                  scanVideos(t)
                  val (f, panel, _) = sheet()
                  val head = LinearLayout(this)
                  head.gravity = Gravity.CENTER_VERTICAL
                  head.addView(tv(this, "Video tìm thấy (${t.media.size})", 20f, P.text, true), lp(0, WRAP, 1f))
                  val close = tv(this, "Đóng", 14f, P.accent, true)
                  close.setPadding(dp(8), dp(12), dp(8), dp(12))
                  close.setOnClickListener { popOverlay() }
                  head.addView(close)
                  panel.addView(head)
                  val sv = ScrollView(this)
                  val list = LinearLayout(this)
                  list.orientation = LinearLayout.VERTICAL
                  sv.addView(list)
                  panel.addView(sv, lp(MATCH, WRAP))
                  if (t.media.isEmpty()) {
                      list.addView(tv(this, "Chưa thấy video. Hãy bấm phát video trên trang rồi mở lại.", 14f, P.muted))
                  }
                  val ua = t.web?.settings?.userAgentString ?: ""
                  for (m in t.media) {
                      val card = LinearLayout(this)
                      card.orientation = LinearLayout.VERTICAL
                      card.background = rr(this, P.bg, 16, P.line)
                      card.setPadding(dp(12), dp(12), dp(12), dp(12))
                      val r1 = LinearLayout(this)
                      r1.gravity = Gravity.CENTER_VERTICAL
                      val badge = tv(this, m.type, 12f, P.bg, true)
                      badge.background = rr(this, P.video, 8)
                      badge.setPadding(dp(8), dp(3), dp(8), dp(3))
                      r1.addView(badge)
                      val name = tv(this, Uri.decode(m.url.substringBefore('?').substringAfterLast('/')).take(40), 13f, P.text)
                      name.maxLines = 1
                      val np = lp(0, WRAP, 1f); np.leftMargin = dp(10); np.rightMargin = dp(8)
                      r1.addView(name, np)
                      val size = tv(this, if (m.type == "HLS") "Luồng" else if (m.type == "DASH") "Không tải được" else "...", 12f, P.muted)
                      r1.addView(size)
                      card.addView(r1)
                      if (m.type != "HLS" && m.type != "DASH") {
                          Thread {
                              val n = Downloader.fetchSize(m.url, m.referer, ua)
                              runOnUiThread { size.text = if (n > 0) String.format(Locale.US, "%.1f MB", n / 1048576.0) else "" }
                          }.start()
                      }
                      val r2 = LinearLayout(this)
                      val rp = lp(MATCH, WRAP); rp.topMargin = dp(10)
                      val b1 = btn(this, "Phát", P.accent, P.onAccent, 0) { popOverlay(); playUrl(m, t, ua) }
                      val b2 = btn(this, "Sao chép", P.surface, P.text, P.line) { copy(m.url) }
                      val b3 = btn(this, "Tải về", P.surface, if (m.type == "DASH") P.muted else P.text, P.line) { popOverlay(); startDownload(m, t) }
                      r2.addView(b1, lp(0, WRAP, 1f))
                      val p2 = lp(0, WRAP, 1f); p2.leftMargin = dp(8); r2.addView(b2, p2)
