                      Triple(19, "Giới thiệu", "Phiên bản và tính năng")
                  )
                  var row: LinearLayout? = null
                  for (i in cats.indices) {
                      if (i % 2 == 0) {
                          row = LinearLayout(this)
                          row.orientation = LinearLayout.HORIZONTAL
                          val rp = lp(MATCH, WRAP); rp.topMargin = dp(14)
                          body.addView(row, rp)
                      }
                      val c = cats[i]
                      val tile = LinearLayout(this)
                      tile.orientation = LinearLayout.VERTICAL
                      tile.gravity = Gravity.CENTER_HORIZONTAL
                      tile.background = rr(this, P.surface, 20, P.line)
                      tile.setPadding(dp(12), dp(20), dp(12), dp(18))
                      val ic = IconView(this, c.first)
                      ic.color = P.accent
                      ic.background = rr(this, (P.accent and 0x00FFFFFF) or (0x22 shl 24), 28)
                      tile.addView(ic, lp(dp(56), dp(56)))
                      val nm = tv(this, c.second, 16f, P.text, true)
                      nm.gravity = Gravity.CENTER
                      val np = lp(MATCH, WRAP); np.topMargin = dp(12)
                      tile.addView(nm, np)
                      val sb = tv(this, c.third, 12f, P.muted)
                      sb.gravity = Gravity.CENTER
                      val sp = lp(MATCH, WRAP); sp.topMargin = dp(2)
                      tile.addView(sb, sp)
                      tile.minimumHeight = dp(150)
                      tile.setOnClickListener {
                          when (i) {
                              0 -> settingsLook()
                              1 -> settingsGeneral()
                              2 -> settingsAds()
                              3 -> settingsPrivacy()
                              else -> settingsAbout()
                          }
                      }
                      val tp = lp(0, WRAP, 1f)
                      if (i % 2 == 1) tp.leftMargin = dp(14)
                      row!!.addView(tile, tp)
                  }
                  if (cats.size % 2 == 1) { val spc = lp(0, 1, 1f); spc.leftMargin = dp(14); row!!.addView(View(this), spc) }
                  pushOverlay(f)
              }

