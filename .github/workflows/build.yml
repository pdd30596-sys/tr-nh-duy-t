name: Build Trinh Duyet

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Tao ma nguon du an
        run: |
          mkdir -p "$HOME/proj" && cd "$HOME/proj"
          mkdir -p "app"
          cat > "app/build.gradle" <<'AMLICH_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'vn.luot.app'
              compileSdk 34

              defaultConfig {
                  applicationId "vn.luot.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 11
                  versionName "2.0"
              }

              signingConfigs {
                  debug {
                      storeFile rootProject.file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'AMLICH_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" android:mimeType="video/*" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" android:mimeType="video/*" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" android:mimeType="application/x-mpegURL" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PlayerActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|uiMode"
                      android:exported="false"
                      android:screenOrientation="fullSensor"
                      android:supportsPictureInPicture="true" />

                  <service
                      android:name=".DlService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/luot/app"
          cat > "app/src/main/java/vn/luot/app/AdBlock.kt" <<'AMLICH_EOF'
          package vn.luot.app

          import android.content.Context
          import android.net.Uri
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          object AdBlock {
              @Volatile private var extra: HashSet<String> = HashSet()
              val extraCount: Int get() = extra.size

              private val lists = listOf(
                  "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt",
                  "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"
              )

              fun loadExtra(ctx: Context) {
                  try {
                      val f = File(ctx.filesDir, "filter.txt")
                      if (!f.exists()) return
                      val s = HashSet<String>()
                      f.forEachLine { if (it.isNotBlank()) s.add(it.trim()) }
                      extra = s
                  } catch (e: Exception) { }
              }

              private fun parse(text: String, into: HashSet<String>) {
                  for (raw in text.lineSequence()) {
                      val l = raw.trim()
                      if (l.isEmpty() || l.startsWith("#") || l.startsWith("!") || l.startsWith("@@")) continue
                      var d: String? = null
                      if (l.startsWith("||")) {
                          val e = l.indexOf('^')
                          if (e > 2) d = l.substring(2, e)
                      } else if (l.startsWith("0.0.0.0 ") || l.startsWith("127.0.0.1 ")) {
                          d = l.substringAfter(' ').trim().substringBefore(' ')
                      }
                      if (d == null) continue
                      d = d.lowercase()
                      if (d.contains('*') || d.contains('/') || d.contains(':') || !d.contains('.') || d == "localhost") continue
                      into.add(d)
                  }
              }

              /** Tải danh sách lọc mở rộng. Trả về số tên miền, hoặc -1 nếu lỗi hoàn toàn. */
              fun updateExtra(ctx: Context): Int {
                  val s = HashSet<String>()
                  for (u in lists) {
                      try {
                          val c = URL(u).openConnection() as HttpURLConnection
                          c.connectTimeout = 15000; c.readTimeout = 30000
                          c.setRequestProperty("User-Agent", "Mozilla/5.0 Luot")
                          if (c.responseCode in 200..299) parse(String(c.inputStream.use { it.readBytes() }, Charsets.UTF_8), s)
                          c.disconnect()
                      } catch (e: Exception) { }
                  }
                  if (s.size < 500) return -1
                  try { File(ctx.filesDir, "filter.txt").writeText(s.joinToString("\n")) } catch (e: Exception) { }
                  extra = s
                  return s.size
              }

              /** Dùng cho điều hướng trang chính: tên miền này có thuộc danh sách quảng cáo không. */
              fun isAdHost(url: String, level: Int): Boolean {
                  val host = try { Uri.parse(url).host?.lowercase() } catch (e: Exception) { null } ?: return false
                  if (hostMatch(host, base)) return true
                  if (level >= 1 && (hostMatch(host, mid) || hostMatch(host, extra))) return true
                  if (level >= 2 && hostMatch(host, strong)) return true
                  return false
              }

              // Mức 1 (Nhẹ): mạng quảng cáo lớn
              private val base = hashSetOf(
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com", "adservice.google.com",
                  "pagead2.googlesyndication.com", "adnxs.com", "taboola.com", "outbrain.com", "popads.net",
                  "propellerads.com", "popcash.net", "exoclick.com", "juicyads.com", "trafficjunky.com",
                  "adsterra.com", "revcontent.com", "mgid.com", "criteo.com", "criteo.net", "pubmatic.com",
                  "rubiconproject.com", "openx.net", "casalemedia.com", "smartadserver.com", "adform.net",
                  "amazon-adsystem.com", "moatads.com", "adcolony.com", "applovin.com", "ads.yahoo.com",
                  "advertising.com", "yieldmo.com", "teads.tv", "33across.com", "indexww.com",
                  "sharethrough.com", "bidswitch.net", "lijit.com", "sovrn.com", "contextweb.com", "zedo.com",
                  "adroll.com", "clickadu.com", "hilltopads.net", "adtima.vn", "admicro.vn", "eclick.vn",
                  "ants.vn", "adskeeper.com", "tsyndicate.com", "a-ads.com", "adspyglass.com", "ad-maven.com",
                  "admaven.com", "adcash.com", "bidvertiser.com", "yllix.com", "ero-advertising.com",
                  "onclickads.net", "pushwoosh.com", "richpush.co", "evadav.com", "monetag.com"
              )

              // Mức 2 (Vừa): thêm theo dõi/đo lường
              private val mid = hashSetOf(
                  "scorecardresearch.com", "quantserve.com", "hotjar.com", "chartbeat.com", "mixpanel.com",
                  "segment.io", "krxd.net", "bluekai.com", "demdex.net", "adsrvr.org", "everesttech.net",
                  "rlcdn.com", "tapad.com", "mathtag.com", "serving-sys.com", "2mdn.net", "adsymptotic.com",
                  "ml314.com", "bounceexchange.com", "outbrainimg.com", "zemanta.com"
              )

              // Mức 3 (Mạnh): thêm phân tích lớn + quy tắc đường dẫn
              private val strong = hashSetOf(
                  "google-analytics.com", "googletagmanager.com", "googletagservices.com", "analytics.google.com",
                  "connect.facebook.net", "static.ads-twitter.com", "analytics.twitter.com", "bat.bing.com",
                  "clarity.ms", "mc.yandex.ru", "analytics.tiktok.com", "snap.licdn.com", "px.ads.linkedin.com",
                  "fullstory.com", "mouseflow.com", "crazyegg.com", "optimizely.com", "newrelic.com", "nr-data.net"
              )

              // Bộ theo dõi (chống theo dõi): trừ SDK đăng nhập/tính năng có thể làm hỏng trang
              private val trk: HashSet<String> by lazy {
                  val s = HashSet<String>(mid)
                  for (d in strong) if (d != "connect.facebook.net" && d != "optimizely.com" && d != "newrelic.com" && d != "nr-data.net") s.add(d)
                  s
              }

              private val badPaths = listOf(
                  "/pagead/", "/adserver", "/ads/", "/adframe", "adsbygoogle", "/popunder", "/prebid", "/advert/", "/banners/ad"
              )

              private fun hostMatch(h: String, set: Set<String>): Boolean {
                  var x = h
                  while (true) {
                      if (set.contains(x)) return true
                      val i = x.indexOf('.')
                      if (i < 0) return false
                      x = x.substring(i + 1)
                  }
              }

              /** 0: cho qua, 1: quảng cáo, 2: bộ theo dõi. level < 0: tắt chặn quảng cáo. */
              fun classify(url: String, level: Int, track: Boolean): Int {
                  val host = try { Uri.parse(url).host?.lowercase() } catch (e: Exception) { null } ?: return 0
                  if (track && hostMatch(host, trk)) return 2
                  if (level >= 0 && hostMatch(host, base)) return 1
                  if (level >= 1 && (hostMatch(host, mid) || hostMatch(host, extra))) return 1
                  if (level >= 2) {
                      if (hostMatch(host, strong)) return 1
                      val l = url.lowercase()
                      for (p in badPaths) if (l.contains(p)) return 1
                  }
                  return 0
              }

              fun privacyJs(webrtc: Boolean, dnt: Boolean, fp: Boolean): String {
                  if (!webrtc && !dnt && !fp) return ""
                  val sb = StringBuilder("(function(){try{if(window.__luotp)return;window.__luotp=1;")
                  if (webrtc) sb.append("['RTCPeerConnection','webkitRTCPeerConnection','mozRTCPeerConnection','RTCDataChannel'].forEach(function(n){try{Object.defineProperty(window,n,{value:undefined,configurable:true});}catch(e){}});")
                  if (dnt) sb.append("try{Object.defineProperty(navigator,'doNotTrack',{get:function(){return '1';}});Object.defineProperty(navigator,'globalPrivacyControl',{get:function(){return true;}});}catch(e){}")
                  if (dnt) sb.append("try{var m=document.createElement('meta');m.name='referrer';m.content='strict-origin-when-cross-origin';(document.head||document.documentElement).appendChild(m);}catch(e){}")
                  if (fp) sb.append("try{var tdu=HTMLCanvasElement.prototype.toDataURL;HTMLCanvasElement.prototype.toDataURL=function(){try{var c=this.getContext('2d');if(c&&this.width>0&&this.height>0&&this.width*this.height<4000000){var d=c.getImageData(0,0,1,1);d.data[0]=(d.data[0]+1)&255;c.putImageData(d,0,0);}}catch(e){}return tdu.apply(this,arguments);};}catch(e){}" +
                      "try{Object.defineProperty(navigator,'hardwareConcurrency',{get:function(){return 4;}});Object.defineProperty(navigator,'deviceMemory',{get:function(){return 4;}});}catch(e){}")
                  sb.append("}catch(e){}})();")
                  return sb.toString()
              }

              fun shouldBlock(url: String, level: Int): Boolean {
                  val host = try { Uri.parse(url).host?.lowercase() } catch (e: Exception) { null } ?: return false
                  if (hostMatch(host, base)) return true
                  if (level >= 1 && (hostMatch(host, mid) || hostMatch(host, extra))) return true
                  if (level >= 2) {
                      if (hostMatch(host, strong)) return true
                      val l = url.lowercase()
                      for (p in badPaths) if (l.contains(p)) return true
                  }
                  return false
              }

              /** Ẩn khung quảng cáo còn sót trên trang (mức Vừa trở lên). */
              fun cosmeticJs(level: Int): String {
                  if (level < 1) return ""
                  var css = "ins.adsbygoogle,.adsbygoogle,[id^=\"div-gpt-ad\"],[id^=\"google_ads\"],[class*=\"ad-banner\"],[class*=\"adsbox\"]," +
                      "iframe[src*=\"doubleclick\"],iframe[src*=\"googlesyndication\"],iframe[id^=\"google_ads\"],iframe[src*=\"/ads/\"],iframe[src*=\"adserver\"]," +
                      "[id^=\"taboola\"],[class*=\"taboola\"],[id^=\"outbrain\"],[class*=\"outbrain\"],[data-ad-slot],[data-google-query-id],[aria-label=\"Advertisement\"],[aria-label=\"Quảng cáo\"]," +
                      "[class*=\"banner-ads\"],[class*=\"ads-banner\"],[class*=\"ad-placeholder\"],[class*=\"sponsor-ad\"],[id*=\"ad-slot\"],[class*=\"adslot\"]"
                  if (level >= 2) css += ",[class*=\"advert\"],[id*=\"advert\"],.ad-slot,.ad-wrapper,.ad-box,.ad-container,[class$=\"-ads\"],[id$=\"-ads\"],[class^=\"ads-\"],[class*=\" ads-\"],[id^=\"ads-\"],[class*=\"popup-ad\"],[class*=\"floating-ad\"],[class*=\"sticky-ad\"]"
                  css += "{display:none!important;visibility:hidden!important}"
                  return "(function(){try{if(document.getElementById('luot-ab'))return;var s=document.createElement('style');s.id='luot-ab';s.textContent='" +
                      css.replace("'", "\\'") + "';(document.head||document.documentElement).appendChild(s);}catch(e){}})();"
              }

              /** Chặn window.open khi người dùng chưa chạm trong 1 giây gần nhất. */
              fun guardJs(): String {
                  return "(function(){try{if(window.__luot)return;window.__luot=1;var last=0;['touchstart','touchend','click','keydown'].forEach(function(e){window.addEventListener(e,function(){last=Date.now();},true);});" +
                      "var o=window.open;window.open=function(){if(Date.now()-last>1000)return null;return o.apply(window,arguments);};}catch(e){}})();"
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/luot/app"
          cat > "app/src/main/java/vn/luot/app/Downloader.kt" <<'AMLICH_EOF'
          package vn.luot.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.IBinder
          import android.provider.MediaStore
          import android.webkit.CookieManager
          import java.io.File
          import java.io.IOException
          import java.io.OutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Callable
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.concurrent.Executors
          import java.util.concurrent.Future
          import java.util.concurrent.atomic.AtomicInteger
          import javax.crypto.Cipher
          import javax.crypto.spec.IvParameterSpec
          import javax.crypto.spec.SecretKeySpec

          class DlItem(val id: Int, val name: String, val url: String, val referer: String?, val ua: String, val hls: Boolean) {
              @Volatile var status = 0      // 0 chờ, 1 đang tải, 2 xong, 3 lỗi, 4 hủy
              @Volatile var progress = -1   // 0..100, -1 chưa rõ
              @Volatile var info = "Đang chờ"
              @Volatile var uri: String? = null
              @Volatile var cancel = false
              @Volatile var fileName = ""
          }

          class Variant(val url: String, val bw: Int, val res: String?)

          class Sink(val os: OutputStream, val uri: Uri?, val file: File?)

          object Downloader {
              val items = CopyOnWriteArrayList<DlItem>()
              @Volatile var onChange: (() -> Unit)? = null
              @Volatile var service: Service? = null
              private val exec = Executors.newFixedThreadPool(2)
              private val ids = AtomicInteger(1)
              private var appCtx: Context? = null

              fun load(ctx: Context) {
                  appCtx = ctx.applicationContext
                  if (items.isNotEmpty()) return
                  for (t in Store.dls(ctx)) {
                      val d = DlItem(ids.getAndIncrement(), t.first, "", null, "", false)
                      d.fileName = t.first; d.uri = t.second; d.status = 2; d.progress = 100; d.info = t.third
                      items.add(d)
                  }
              }

              fun persist(ctx: Context) {
                  Store.saveDls(ctx, items.filter { it.status == 2 && it.uri != null }.map { Triple(it.fileName, it.uri!!, it.info) })
              }

              fun enqueue(ctx: Context, name: String, url: String, referer: String?, ua: String, hls: Boolean): DlItem {
                  appCtx = ctx.applicationContext
                  val d = DlItem(ids.getAndIncrement(), name, url, referer, ua, hls)
                  d.fileName = name
                  items.add(0, d)
                  try { ctx.startForegroundService(Intent(ctx, DlService::class.java)) } catch (e: Exception) { }
                  exec.execute { run(d) }
                  notifyChange()
                  return d
              }

              fun notifyChange() {
                  onChange?.invoke()
                  val ctx = appCtx ?: return
                  val active = items.filter { it.status <= 1 }
                  val svc = service
                  if (active.isEmpty()) {
                      if (svc != null) { svc.stopForeground(true); svc.stopSelf(); service = null }
                      return
                  }
                  try {
                      val prog = active.filter { it.progress >= 0 }.map { it.progress }
                      val avg = if (prog.isEmpty()) 0 else prog.sum() / prog.size
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(1, DlService.build(ctx, active.size, avg, prog.isEmpty()))
                  } catch (e: Exception) { }
              }

              private fun run(d: DlItem) {
                  val ctx = appCtx ?: return
                  d.status = 1; d.info = "Đang bắt đầu"; notifyChange()
                  try {
                      if (d.hls) downloadHls(ctx, d) else downloadDirect(ctx, d)
                  } catch (e: Exception) {
                      if (d.cancel) { d.status = 4; d.info = "Đã hủy" }
                      else { d.status = 3; d.info = "Lỗi: " + (e.message ?: e.javaClass.simpleName) }
                  }
                  persist(ctx)
                  notifyChange()
              }

              // ---------- mạng ----------
              private fun open(url: String, referer: String?, ua: String): HttpURLConnection {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 25000
                  c.instanceFollowRedirects = true
                  if (ua.isNotEmpty()) c.setRequestProperty("User-Agent", ua)
                  if (!referer.isNullOrEmpty()) {
                      c.setRequestProperty("Referer", referer)
                      try { val u = URL(referer); c.setRequestProperty("Origin", u.protocol + "://" + u.host) } catch (e: Exception) { }
                  }
                  val ck = try { CookieManager.getInstance().getCookie(url) } catch (e: Exception) { null }
                  if (!ck.isNullOrEmpty()) c.setRequestProperty("Cookie", ck)
                  c.connect()
                  if (c.responseCode !in 200..299) throw IOException("HTTP " + c.responseCode)
                  return c
              }

              fun fetchText(url: String, referer: String?, ua: String): String {
                  val c = open(url, referer, ua)
                  return c.inputStream.use { String(it.readBytes(), Charsets.UTF_8) }
              }

              fun fetchSize(url: String, referer: String?, ua: String): Long {
                  return try {
                      val c = URL(url).openConnection() as HttpURLConnection
                      c.requestMethod = "HEAD"; c.connectTimeout = 8000; c.readTimeout = 8000
                      if (ua.isNotEmpty()) c.setRequestProperty("User-Agent", ua)
                      if (!referer.isNullOrEmpty()) c.setRequestProperty("Referer", referer)
                      c.connect()
                      val l = c.contentLengthLong
                      c.disconnect()
                      l
                  } catch (e: Exception) { -1L }
              }

              private fun resolve(base: String, rel: String): String = URL(URL(base), rel).toString()

              private fun attr(attrs: String, name: String): String? {
                  val m = Regex("(?:^|,)" + name + "=(\"[^\"]*\"|[^,]*)").find(attrs) ?: return null
                  return m.groupValues[1].trim('"')
              }

              fun parseVariants(text: String, base: String): List<Variant> {
                  val out = ArrayList<Variant>()
                  val lines = text.lines()
                  var i = 0
                  while (i < lines.size) {
                      val l = lines[i].trim()
                      if (l.startsWith("#EXT-X-STREAM-INF:")) {
                          val a = l.substringAfter(':')
                          val bw = attr(a, "BANDWIDTH")?.toIntOrNull() ?: 0
                          val res = attr(a, "RESOLUTION")
                          var j = i + 1
                          while (j < lines.size && (lines[j].trim().isEmpty() || lines[j].trim().startsWith("#"))) j++
                          if (j < lines.size) out.add(Variant(resolve(base, lines[j].trim()), bw, res))
                          i = j
                      }
                      i++
                  }
                  out.sortByDescending { it.bw }
                  return out
              }

              private fun hex(s: String): ByteArray {
                  var h = s.trim().removePrefix("0x").removePrefix("0X")
                  while (h.length < 32) h = "0$h"
                  val b = ByteArray(16)
                  for (i in 0 until 16) b[i] = h.substring(i * 2, i * 2 + 2).toInt(16).toByte()
                  return b
              }

              // ---------- ghi tệp ----------
              private fun mimeFor(fname: String): String {
                  val e = fname.substringAfterLast('.', "").lowercase()
                  return when (e) {
                      "ts" -> "video/mp2t"; "webm" -> "video/webm"; "mkv" -> "video/x-matroska"
                      "mov" -> "video/quicktime"; "flv" -> "video/x-flv"; else -> "video/mp4"
                  }
              }

              private fun openSink(ctx: Context, fname: String): Sink {
                  if (Build.VERSION.SDK_INT >= 29) {
                      val cv = ContentValues()
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, fname)
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, mimeFor(fname))
                      cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Movies/Luot")
                      cv.put(MediaStore.MediaColumns.IS_PENDING, 1)
                      val u = ctx.contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, cv) ?: throw IOException("Không tạo được tệp")
                      val os = ctx.contentResolver.openOutputStream(u) ?: throw IOException("Không ghi được tệp")
                      return Sink(os, u, null)
                  }
                  val dir = ctx.getExternalFilesDir(Environment.DIRECTORY_MOVIES) ?: throw IOException("Không có bộ nhớ")
                  dir.mkdirs()
                  val f = File(dir, fname)
                  return Sink(f.outputStream(), null, f)
              }

              private fun finishSink(ctx: Context, s: Sink, d: DlItem) {
                  if (s.uri != null) {
                      val cv = ContentValues()
                      cv.put(MediaStore.MediaColumns.IS_PENDING, 0)
                      ctx.contentResolver.update(s.uri, cv, null, null)
                      d.uri = s.uri.toString()
                  } else if (s.file != null) {
                      d.uri = Uri.fromFile(s.file).toString()
                  }
              }

              private fun deleteSink(ctx: Context, s: Sink) {
                  try {
                      if (s.uri != null) ctx.contentResolver.delete(s.uri, null, null)
                      else s.file?.delete()
                  } catch (e: Exception) { }
              }

              private fun mb(n: Long) = String.format(java.util.Locale.US, "%.1f MB", n / 1048576.0)

              // ---------- tải trực tiếp (mp4...) ----------
              private fun downloadDirect(ctx: Context, d: DlItem) {
                  val conn = open(d.url, d.referer, d.ua)
                  val len = conn.contentLengthLong
                  val sink = openSink(ctx, d.fileName)
                  var ok = false
                  try {
                      conn.inputStream.use { ins ->
                          val buf = ByteArray(65536)
                          var written = 0L
                          var lastNotify = 0L
                          while (true) {
                              if (d.cancel) throw IOException("hủy")
                              val n = ins.read(buf)
                              if (n < 0) break
                              sink.os.write(buf, 0, n)
                              written += n
                              d.progress = if (len > 0) (written * 100 / len).toInt() else -1
                              d.info = if (len > 0) mb(written) + " / " + mb(len) else mb(written)
                              val now = System.currentTimeMillis()
                              if (now - lastNotify > 400) { lastNotify = now; notifyChange() }
                          }
                      }
                      ok = true
                  } finally {
                      try { sink.os.close() } catch (e: Exception) { }
                      if (ok) { finishSink(ctx, sink, d); d.status = 2; d.progress = 100; d.info = "Đã lưu trong Movies/Luot" }
                      else deleteSink(ctx, sink)
                  }
              }

              // ---------- tải HLS (m3u8) và ghép ----------
              private class Seg(val url: String, val seq: Long, val key: ByteArray?, val iv: ByteArray?)

              private fun decrypt(b: ByteArray, s: Seg): ByteArray {
                  val key = s.key ?: return b
                  val iv = s.iv ?: ByteArray(16).also { arr ->
                      for (i in 0 until 8) arr[15 - i] = ((s.seq shr (8 * i)) and 0xff).toByte()
                  }
                  return try {
                      val c = Cipher.getInstance("AES/CBC/PKCS5Padding")
                      c.init(Cipher.DECRYPT_MODE, SecretKeySpec(key, "AES"), IvParameterSpec(iv))
                      c.doFinal(b)
                  } catch (e: Exception) {
                      val c = Cipher.getInstance("AES/CBC/NoPadding")
                      c.init(Cipher.DECRYPT_MODE, SecretKeySpec(key, "AES"), IvParameterSpec(iv))
                      val whole = b.size - (b.size % 16)
                      c.doFinal(b, 0, whole)
                  }
              }

              private fun downloadHls(ctx: Context, d: DlItem) {
                  var plUrl = d.url
                  var text = fetchText(plUrl, d.referer, d.ua)
                  if (text.contains("#EXT-X-STREAM-INF")) {
                      val v = parseVariants(text, plUrl).firstOrNull() ?: throw IOException("Danh sách phát rỗng")
                      plUrl = v.url
                      text = fetchText(plUrl, d.referer, d.ua)
                  }
                  val segs = ArrayList<Seg>()
                  var seq = 0L
                  var key: ByteArray? = null
                  var ivAttr: ByteArray? = null
                  var mapUrl: String? = null
                  var end = false
                  for (raw in text.lines()) {
                      val l = raw.trim()
                      if (l.isEmpty()) continue
                      if (l.startsWith("#EXT-X-MEDIA-SEQUENCE:")) {
                          seq = l.substringAfter(':').trim().toLongOrNull() ?: 0L
                      } else if (l.startsWith("#EXT-X-KEY:")) {
                          val a = l.substringAfter(':')
                          val m = attr(a, "METHOD")
                          if (m == "NONE") { key = null; ivAttr = null }
                          else if (m == "AES-128") {
                              val ku = attr(a, "URI") ?: throw IOException("Thiếu khóa giải mã")
                              val kc = open(resolve(plUrl, ku), d.referer, d.ua)
                              key = kc.inputStream.use { it.readBytes() }
                              val iv = attr(a, "IV")
                              ivAttr = if (iv != null) hex(iv) else null
                          } else throw IOException("Video mã hóa ($m) chưa hỗ trợ")
                      } else if (l.startsWith("#EXT-X-MAP:")) {
                          val u = attr(l.substringAfter(':'), "URI")
                          if (u != null) mapUrl = resolve(plUrl, u)
                      } else if (l.startsWith("#EXT-X-ENDLIST")) {
                          end = true
                      } else if (!l.startsWith("#")) {
                          segs.add(Seg(resolve(plUrl, l), seq, key, ivAttr))
                          seq++
                      }
                  }
                  if (segs.isEmpty()) throw IOException("Không có phân đoạn nào")
                  if (!end) throw IOException("Đây là luồng trực tiếp (live), không tải được")
                  val ext = if (mapUrl != null) ".mp4" else ".ts"
                  d.fileName = d.name.substringBeforeLast('.') + ext
                  val sink = openSink(ctx, d.fileName)
                  val pool = Executors.newFixedThreadPool(4)
                  var ok = false
                  try {
                      val total = segs.size
                      if (mapUrl != null) {
                          val c = open(mapUrl, d.referer, d.ua)
                          sink.os.write(c.inputStream.use { it.readBytes() })
                      }
                      val q = java.util.ArrayDeque<Future<ByteArray>>()
                      var next = 0
                      var done = 0
                      var bytes = 0L
                      var lastNotify = 0L
                      while (done < total) {
                          if (d.cancel) throw IOException("hủy")
                          while (next < total && q.size < 8) {
                              val s = segs[next++]
                              q.add(pool.submit(Callable<ByteArray> { fetchSeg(s, d) }))
                          }
                          val data = q.removeFirst().get()
                          sink.os.write(data)
                          bytes += data.size
                          done++
                          d.progress = done * 100 / total
                          d.info = "$done/$total đoạn · " + mb(bytes)
                          val now = System.currentTimeMillis()
                          if (now - lastNotify > 400) { lastNotify = now; notifyChange() }
                      }
                      ok = true
                  } finally {
                      pool.shutdownNow()
                      try { sink.os.close() } catch (e: Exception) { }
                      if (ok) { finishSink(ctx, sink, d); d.status = 2; d.progress = 100; d.info = "Đã ghép xong, lưu trong Movies/Luot" }
                      else deleteSink(ctx, sink)
                  }
              }

              private fun fetchSeg(s: Seg, d: DlItem): ByteArray {
                  var last: Exception? = null
                  for (attempt in 0 until 3) {
                      if (d.cancel) throw IOException("hủy")
                      try {
                          val c = open(s.url, d.referer, d.ua)
                          val b = c.inputStream.use { it.readBytes() }
                          return decrypt(b, s)
                      } catch (e: Exception) {
                          last = e
                          try { Thread.sleep(600) } catch (ie: InterruptedException) { throw e }
                      }
                  }
                  throw last ?: IOException("Lỗi tải đoạn")
              }
          }

          class DlService : Service() {
              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  Downloader.service = this
                  try { startForeground(1, build(this, 1, 0, true)) } catch (e: Exception) { }
                  Downloader.notifyChange()
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  if (Downloader.service === this) Downloader.service = null
                  super.onDestroy()
              }

              companion object {
                  fun build(ctx: Context, count: Int, avg: Int, indeterminate: Boolean): Notification {
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(NotificationChannel("dl", "Tải video", NotificationManager.IMPORTANCE_LOW))
                      return Notification.Builder(ctx, "dl")
                          .setSmallIcon(android.R.drawable.stat_sys_download)
                          .setContentTitle("Trình Duyệt đang tải $count video")
                          .setOngoing(true)
                          .setProgress(100, avg, indeterminate)
                          .build()
                  }
              }
          }
