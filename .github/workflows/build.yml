              private fun toUrl(input: String): String {
                  val s = input.trim()
                  if (s.startsWith("http://") || s.startsWith("https://")) return s
                  if (!s.contains(' ') && (s.contains('.') || s.startsWith("localhost"))) return "https://$s"
                  val q = Uri.encode(s)
                  return when (Store.engine(this)) {
                      1 -> "https://www.bing.com/search?q=$q"
                      2 -> "https://duckduckgo.com/?q=$q"
                      else -> "https://www.google.com/search?q=$q"
                  }
              }

              private fun go(input: String) {
                  if (input.isBlank()) return
                  val u = toUrl(input)
                  val t = tabs[cur]
                  t.url = u
                  t.media.clear()
                  val w = t.web ?: makeWeb(t)
                  t.web = w
                  showTab()
                  w.loadUrl(u)
              }

              private fun goHome() {
                  val t = tabs[cur]
                  t.web?.destroy(); t.web = null; t.url = ""; t.title = "Trang chủ"; t.media.clear(); t.blocked = 0
                  showTab()
              }

              private fun closeToOpener(t: Tab) {
                  val op = t.opener
                  val i = tabs.indexOf(t)
                  if (i < 0) return
                  closeTab(i)
                  if (op != null && tabs.contains(op)) cur = tabs.indexOf(op)
                  showTab()
              }

              private fun navBack() {
                  val t = tabs[cur]
                  val w = t.web
                  if (w != null && w.canGoBack()) w.goBack()
                  else if (w != null && t.opener != null && tabs.contains(t.opener)) closeToOpener(t)
                  else if (w != null) goHome()
              }

              private fun navFwd() {
                  val w = tabs[cur].web
                  if (w != null && w.canGoForward()) w.goForward()
              }

              private fun newTab(url: String? = null, opener: Tab? = null) {
                  val nt0 = Tab()
                  nt0.opener = opener
                  tabs.add(nt0)
                  cur = tabs.size - 1
                  if (url != null) go(url) else showTab()
              }

              private fun closeTab(i: Int) {
                  tabs[i].web?.destroy()
                  tabs.removeAt(i)
                  if (tabs.isEmpty()) tabs.add(Tab())
                  if (cur >= tabs.size) cur = tabs.size - 1
                  else if (i < cur) cur--
              }

              private fun showTab() {
                  if (findBar != null) closeFind()
                  content.removeAllViews()
                  val t = tabs[cur]
                  if (t.web == null && t.url.isEmpty()) {
                      topBar.visibility = View.GONE
                      progressBar.scaleX = 0f
                      content.addView(buildHome(), FrameLayout.LayoutParams(MATCH, MATCH))
                  } else {
                      topBar.visibility = View.VISIBLE
                      if (t.web == null) { t.web = makeWeb(t); t.web!!.loadUrl(t.url) }
                      val w = t.web!!
                      (w.parent as? ViewGroup)?.removeView(w)
                      content.addView(w, FrameLayout.LayoutParams(MATCH, MATCH))
                      if (!urlEdit.hasFocus()) urlEdit.setText(t.url)
                      progressBar.scaleX = if (t.progress in 1..99) t.progress / 100f else 0f
                  }
                  updateNav()
                  updateShield()
                  updateBubble()
              }

              private fun updateNav() {
                  val t = tabs[cur]
                  val web = t.web != null
                  backIcon.color = if (web) P.text else P.muted
                  fwdIcon.color = if (web && t.web!!.canGoForward()) P.text else P.muted
                  homeIcon.color = if (!web) P.accent else P.text
                  tabsIcon.color = P.text
                  tabsIcon.count = tabs.size
                  val fav = t.url.isNotEmpty() && Store.isBookmark(this, t.url)
                  starIcon.filled = fav
                  starIcon.color = if (fav) P.star else P.muted
              }

              private fun toggleBookmark() {
                  val t = tabs[cur]
                  if (t.url.isEmpty()) return
                  if (Store.isBookmark(this, t.url)) { Store.removeBookmark(this, t.url); toast("Đã bỏ khỏi yêu thích") }
                  else { Store.addBookmark(this, t.title, t.url); toast("Đã thêm vào yêu thích") }
                  updateNav()
              }

              private fun updateShield() {
                  val t = tabs[cur]
                  val on = (adOn || trackOn) && !exc.contains(hostOf(t.url))
                  shieldChip.text = if (on) "Chặn ${t.blocked}" else "Chặn tắt"
                  shieldChip.setTextColor(if (on) P.accent else P.muted)
              }

              private fun updateBubble() {
                  val t = tabs[cur]
                  val n = t.media.size
                  if (n > 0 && t.web != null && overlays.isEmpty()) {
                      bubble.count = n
                      if (bubble.visibility != View.VISIBLE) {
                          bubble.visibility = View.VISIBLE
                          bubble.alpha = 0f
                          bubble.animate().alpha(1f).setDuration(200).start()
                      }
                      if (fx3d) {
                          if (bubbleAnim == null) {
                              val a = ObjectAnimator.ofFloat(bubble, "rotationY", -14f, 14f)
                              a.duration = 2400; a.repeatCount = ObjectAnimator.INFINITE; a.repeatMode = ObjectAnimator.REVERSE
                              a.interpolator = LinearInterpolator()
                              a.start(); bubbleAnim = a
                          }
                          bubble.rotationX = 8f
                      } else {
                          bubbleAnim?.cancel(); bubbleAnim = null
                          bubble.rotationX = 0f; bubble.rotationY = 0f
                      }
                  } else {
                      bubble.visibility = View.GONE
                      bubbleAnim?.cancel(); bubbleAnim = null
                  }
              }

              // ================= trang chủ =================
              private fun homeIconFor(url: String, label: String): Int? {
                  val h = hostOf(url)
                  val l = label.lowercase()
                  return when {
                      h.contains("youtube") || h.contains("youtu.be") || h.contains("tiktok") || h.contains("netflix") -> R.drawable.ic_m_h_video
                      h.contains("facebook") || h.contains("instagram") || h.contains("zalo") || h.contains("twitter") || h == "x.com" -> R.drawable.ic_m_h_social
                      h.contains("shopee") || h.contains("lazada") || h.contains("tiki") || h.contains("amazon") -> R.drawable.ic_m_h_shop
                      h.contains("translate") -> R.drawable.ic_m_trans
                      url.contains("th%E1%BB%9Di") || l.contains("thời tiết") -> R.drawable.ic_m_h_weather
                      url.contains("/maps") || h.contains("maps") -> R.drawable.ic_m_h_map
                      h.contains("vnexpress") || h.contains("tuoitre") || h.contains("thanhnien") || h.contains("dantri") || l.contains("tin") -> R.drawable.ic_m_h_news
                      else -> null
                  }
              }

