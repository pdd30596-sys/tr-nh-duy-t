              // ---- khiên chặn quảng cáo ----
              private fun shieldDialog() {
                  val t = tabs[cur]
                  val h = hostOf(t.url)
                  val off = exc.contains(h)
                  dlg().setTitle(h.ifEmpty { "Trang này" })
                      .setMessage(if (!adOn && !trackOn) "Chặn quảng cáo và chống theo dõi đang tắt trong Cài đặt." else if (off) "Đã tắt chặn cho trang này." else "Trên trang này đã chặn ${t.blocked - t.trackers} quảng cáo, ${t.trackers} bộ theo dõi và ${t.popups} cửa sổ bật lên.")
                      .setPositiveButton(if (off) "Bật chặn lại" else "Tắt chặn cho trang này") { _, _ ->
                          val s = Store.exceptions(this)
                          if (off) s.remove(h) else if (h.isNotEmpty()) s.add(h)
                          Store.setExceptions(this, s); exc = s
                          t.web?.reload(); updateShield()
                      }
                      .setNeutralButton("Cài đặt") { _, _ -> openSettings() }
                      .setNegativeButton("Đóng", null).show()
              }

