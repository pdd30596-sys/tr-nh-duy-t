              // ================= bắt link video =================
              private fun sniff(t: Tab, url: String) {
                  val path = url.substringBefore('#').substringBefore('?').lowercase()
                  val type = when {
                      path.endsWith(".m3u8") -> "HLS"
                      path.endsWith(".mp4") || path.endsWith(".m4v") || path.endsWith(".mov") -> "MP4"
                      path.endsWith(".webm") -> "WEBM"
                      path.endsWith(".mkv") -> "MKV"
                      path.endsWith(".flv") -> "FLV"
                      path.endsWith(".mpd") -> "DASH"
                      else -> return
                  }
                  val ref = t.url
                  main.post { addMedia(t, url, type, ref) }
              }

              private fun addMedia(t: Tab, url: String, type: String, ref: String?) {
                  if (t.media.any { it.url == url }) return
                  t.media.add(MediaItem(url, type, ref))
                  if (tabs.getOrNull(cur) === t) updateBubble()
              }

              private fun scanVideos(t: Tab) {
                  val w = t.web ?: return
                  w.evaluateJavascript("(function(){var r=[];document.querySelectorAll('video,video source').forEach(function(v){var s=v.currentSrc||v.src;if(s&&s.indexOf('http')===0)r.push(s);});return r.join('\\n');})()") { v ->
                      try {
                          val s = JSONTokener(v ?: "null").nextValue()
                          if (s is String && s.isNotBlank()) {
                              for (u in s.split("\n")) {
                                  val p = u.substringBefore('#').substringBefore('?').lowercase()
                                  val ty = when {
                                      p.endsWith(".m3u8") -> "HLS"
                                      p.endsWith(".webm") -> "WEBM"
                                      p.endsWith(".mpd") -> "DASH"
                                      else -> "MP4"
                                  }
                                  addMedia(t, u, ty, t.url)
                              }
                          }
                      } catch (e: Exception) { }
                  }
              }

              private fun sanitize(s: String): String {
                  val x = s.replace(Regex("[\\\\/:*?\"<>|\\n\\r\\t]"), " ").replace(Regex("\\s+"), " ").trim()
                  return if (x.length > 60) x.substring(0, 60).trim() else x
              }

              private fun requestNotif() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 5)
              }

              private fun startDownload(m: MediaItem, tab: Tab) {
                  requestNotif()
                  val ua = tab.web?.settings?.userAgentString ?: ""
                  val base = sanitize(if (tab.title.isBlank() || tab.title == "Tab mới") hostOf(m.url) else tab.title).ifBlank { "video" }
                  when (m.type) {
                      "DASH" -> toast("Định dạng DASH (.mpd) chưa hỗ trợ tải")
                      "HLS" -> {
                          toast("Đang đọc danh sách phát...")
                          Thread {
                              try {
                                  val text = Downloader.fetchText(m.url, m.referer, ua)
                                  val vars = Downloader.parseVariants(text, m.url)
                                  runOnUiThread {
                                      if (vars.size <= 1) {
                                          Downloader.enqueue(this, "$base.ts", vars.firstOrNull()?.url ?: m.url, m.referer, ua, true)
                                          toast("Đã thêm vào Tải xuống")
                                      } else {
                                          val labels = vars.map { (it.res ?: "?") + " · " + (it.bw / 1000) + " kbps" }.toTypedArray()
                                          dlg().setTitle("Chọn chất lượng").setItems(labels) { _, i ->
                                              Downloader.enqueue(this, "$base (${vars[i].res ?: (vars[i].bw / 1000).toString() + "k"}).ts", vars[i].url, m.referer, ua, true)
                                              toast("Đã thêm vào Tải xuống")
                                          }.show()
                                      }
                                  }
                              } catch (e: Exception) {
                                  runOnUiThread { toast("Không đọc được: " + (e.message ?: "lỗi mạng")) }
                              }
                          }.start()
                      }
                      else -> {
                          val ext = when (m.type) { "WEBM" -> ".webm"; "MKV" -> ".mkv"; "FLV" -> ".flv"; else -> ".mp4" }
                          Downloader.enqueue(this, base + ext, m.url, m.referer, ua, false)
                          toast("Đã thêm vào Tải xuống")
                      }
                  }
              }

