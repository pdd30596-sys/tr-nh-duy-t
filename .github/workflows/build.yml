          cat > "app/src/main/java/vn/luot/app/PlayerActivity.kt" <<'AMLICH_EOF'
          package vn.luot.app

          import android.app.Activity
          import android.app.PictureInPictureParams
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Color
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Rational
          import android.view.GestureDetector
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView

          class PlayerActivity : Activity() {
              private lateinit var vv: VideoView
              private lateinit var controls: LinearLayout
              private lateinit var top: LinearLayout
              private lateinit var playBtn: IconView
              private lateinit var timeTv: TextView
              private lateinit var seek: SeekBar
              private lateinit var seekInfo: TextView
              private lateinit var errTv: TextView
              private var mp: MediaPlayer? = null
              private val h = Handler(Looper.getMainLooper())
              private var url = ""
              private var prepared = false
              private var speedIdx = 1
              private val speeds = floatArrayOf(0.5f, 1f, 1.5f, 2f)
              private var showing = true
              private var dragging = false
              private var inPip = false
              private var refererS = ""
              private var uaS = ""
              private var titleS = ""

              private val tick = object : Runnable {
                  override fun run() {
                      if (prepared && !dragging) {
                          val d = vv.duration
                          val p = vv.currentPosition
                          if (d > 0) { seek.max = d; seek.progress = p }
                          timeTv.text = fmt(p) + " / " + fmt(if (d > 0) d else 0)
                          playBtn.kind = if (vv.isPlaying) 8 else 7; playBtn.invalidate()
                      }
                      h.postDelayed(this, 500)
                  }
              }

              private fun fmt(ms: Int): String {
                  val s = ms / 1000
                  val hh = s / 3600
                  val mm = (s % 3600) / 60
                  val ss = s % 60
                  return if (hh > 0) String.format("%d:%02d:%02d", hh, mm, ss) else String.format("%02d:%02d", mm, ss)
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  url = intent.getStringExtra("url") ?: run { finish(); return }
                  val referer = intent.getStringExtra("referer")
                  val ua = intent.getStringExtra("ua") ?: ""
                  val title = intent.getStringExtra("title") ?: ""
                  refererS = referer ?: ""; uaS = ua; titleS = title

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)
                  vv = VideoView(this)
                  root.addView(vv, FrameLayout.LayoutParams(MATCH, MATCH, Gravity.CENTER))

                  top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.setBackgroundColor(0x99000000.toInt())
                  val back = IconView(this, 0)
                  back.color = Color.WHITE
                  back.setOnClickListener { finish() }
                  top.addView(back, lp(dp(48), dp(48)))
                  val tt = tv(this, title, 15f, Color.WHITE, true)
                  tt.maxLines = 1
                  top.addView(tt, lp(0, WRAP, 1f))
                  root.addView(top, FrameLayout.LayoutParams(MATCH, WRAP, Gravity.TOP))

                  controls = LinearLayout(this)
                  controls.orientation = LinearLayout.VERTICAL
                  controls.setBackgroundColor(0x99000000.toInt())
                  controls.setPadding(dp(12), dp(8), dp(12), dp(12))
                  seek = SeekBar(this)
                  seek.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) { if (fromUser) timeTv.text = fmt(p) + " / " + fmt(seek.max) }
                      override fun onStartTrackingTouch(s: SeekBar?) { dragging = true }
                      override fun onStopTrackingTouch(s: SeekBar?) { dragging = false; vv.seekTo(seek.progress) }
                  })
                  controls.addView(seek, lp(MATCH, WRAP))
                  timeTv = tv(this, "00:00 / 00:00", 13f, Color.WHITE)
                  controls.addView(timeTv, lp(WRAP, WRAP))
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  playBtn = IconView(this, 7)
                  playBtn.color = Color.parseColor("#06223A")
                  playBtn.background = rrr(Color.parseColor("#5BB4F5"))
                  playBtn.contentDescription = "Phát hoặc tạm dừng"
                  playBtn.setOnClickListener { toggle() }
                  row.addView(playBtn, lp(dp(56), dp(56)))
                  row.addView(View(this), lp(0, 1, 1f))
                  fun ib(kind: Int, desc: String, act: () -> Unit) {
                      val v = IconView(this, kind)
                      v.color = Color.WHITE
                      v.contentDescription = desc
                      v.background = rrr(0x33FFFFFF)
                      v.setOnClickListener { act() }
                      val q = lp(dp(52), dp(52)); q.leftMargin = dp(12)
                      row.addView(v, q)
                  }
                  ib(9, "Tốc độ phát") { cycleSpeed() }
                  ib(10, "Cửa sổ nhỏ") { enterPip() }
                  ib(11, "Mở bằng app khác") { openExternal() }
                  val rp = lp(MATCH, WRAP); rp.topMargin = dp(8)
                  controls.addView(row, rp)
                  root.addView(controls, FrameLayout.LayoutParams(MATCH, WRAP, Gravity.BOTTOM))

                  errTv = tv(this, "", 15f, Color.WHITE)
                  errTv.gravity = Gravity.CENTER
                  errTv.setPadding(dp(32), 0, dp(32), 0)
                  errTv.visibility = View.GONE
                  root.addView(errTv, FrameLayout.LayoutParams(MATCH, MATCH, Gravity.CENTER))
                  seekInfo = tv(this, "", 28f, Color.WHITE, true)
                  seekInfo.gravity = Gravity.CENTER
                  seekInfo.setBackgroundColor(0x99000000.toInt())
                  seekInfo.setPadding(dp(20), dp(10), dp(20), dp(10))
                  seekInfo.visibility = View.GONE
                  root.addView(seekInfo, FrameLayout.LayoutParams(WRAP, WRAP, Gravity.CENTER))
                  setContentView(root)

                  val gd = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent): Boolean = true
                      override fun onSingleTapConfirmed(e: MotionEvent): Boolean { setShowing(!showing); return true }
                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (!prepared) return true
                          val d = if (e.x < vv.width / 2f) -10000 else 10000
                          vv.seekTo((vv.currentPosition + d).coerceIn(0, maxOf(0, vv.duration)))
                          return true
                      }
                  })
                  var downX = 0f; var downY = 0f; var startPos = 0; var swiping = false; var target = 0
                  vv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { downX = e.x; downY = e.y; swiping = false; startPos = if (prepared) vv.currentPosition else 0 }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.x - downX
                              val dy = e.y - downY
                              if (!swiping && prepared && Math.abs(dx) > dp(24) && Math.abs(dx) > Math.abs(dy) * 1.5f) swiping = true
                              if (swiping) {
                                  val d = vv.duration
                                  // vuốt hết chiều rộng màn hình = 90 giây
                                  val delta = (dx / vv.width.coerceAtLeast(1) * 90000f).toInt()
                                  target = (startPos + delta).coerceIn(0, maxOf(0, d))
                                  val diff = (target - startPos) / 1000
                                  seekInfo.text = (if (diff >= 0) "+" else "-") + fmt(Math.abs(diff) * 1000) + "\n" + fmt(target) + " / " + fmt(maxOf(0, d))
                                  seekInfo.visibility = View.VISIBLE
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              if (swiping) { vv.seekTo(target); seekInfo.visibility = View.GONE; swiping = false }
                          }
                      }
                      if (!swiping) gd.onTouchEvent(e)
                      true
                  }

                  vv.setOnPreparedListener { m ->
                      mp = m
                      prepared = true
                      val pos = Store.videoPos(this, url)
                      if (pos > 3000 && pos < vv.duration - 3000) vv.seekTo(pos)
                      vv.start()
                      h.postDelayed({ setShowing(false) }, 2500)
                  }
                  vv.setOnCompletionListener { Store.setVideoPos(this, url, 0); Store.clearLastVideo(this, url); playBtn.kind = 7; playBtn.invalidate() }
                  vv.setOnErrorListener { _, _, _ ->
                      errTv.text = "Không phát được video này.\nVideo có thể bị bảo vệ, cần đăng nhập hoặc định dạng không hỗ trợ.\nThử nút \"App khác\"."
                      errTv.visibility = View.VISIBLE
                      setShowing(true)
                      true
                  }
                  val uri = Uri.parse(url)
                  if (url.startsWith("http")) {
                      val hd = HashMap<String, String>()
                      if (ua.isNotEmpty()) hd["User-Agent"] = ua
                      if (!referer.isNullOrEmpty()) hd["Referer"] = referer
                      vv.setVideoURI(uri, hd)
                  } else vv.setVideoURI(uri)
                  h.post(tick)
                  immersive()
              }

              private fun rrr(color: Int): android.graphics.drawable.GradientDrawable {
                  val g = android.graphics.drawable.GradientDrawable()
                  g.shape = android.graphics.drawable.GradientDrawable.OVAL
                  g.setColor(color)
                  return g
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density + 0.5f).toInt()

              private fun setShowing(s: Boolean) {
                  showing = s
                  val v = if (s && !inPip) View.VISIBLE else View.GONE
                  controls.visibility = v
                  top.visibility = v
              }

              private fun toggle() {
                  if (!prepared) return
                  if (vv.isPlaying) vv.pause() else vv.start()
              }

              private fun cycleSpeed() {
                  val m = mp ?: return
                  speedIdx = (speedIdx + 1) % speeds.size
                  val was = vv.isPlaying
                  try {
                      m.playbackParams = m.playbackParams.setSpeed(speeds[speedIdx])
                      if (!was) vv.pause()
                      Toast.makeText(this, "Tốc độ " + (if (speeds[speedIdx] == 1f) "1" else speeds[speedIdx].toString()) + "x", Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) { Toast.makeText(this, "Máy không hỗ trợ đổi tốc độ cho video này", Toast.LENGTH_SHORT).show() }
              }

              private fun enterPip() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try { enterPictureInPictureMode(PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()) } catch (e: Exception) { }
                  }
              }

              private fun openExternal() {
                  try {
                      val i = Intent(Intent.ACTION_VIEW)
                      i.setDataAndType(Uri.parse(url), "video/*")
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      startActivity(Intent.createChooser(i, "Mở bằng"))
                  } catch (e: Exception) { Toast.makeText(this, "Không có app phù hợp", Toast.LENGTH_SHORT).show() }
              }

              @Suppress("DEPRECATION")
              private fun immersive() {
                  val land = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
                  window.decorView.systemUiVisibility = if (land)
                      (View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_LAYOUT_STABLE)
                  else View.SYSTEM_UI_FLAG_VISIBLE
              }

              override fun onConfigurationChanged(c: Configuration) {
                  super.onConfigurationChanged(c)
                  immersive()
              }

              override fun onUserLeaveHint() {
                  if (prepared && vv.isPlaying) enterPip()
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  inPip = isInPictureInPictureMode
                  setShowing(!isInPictureInPictureMode)
              }

              override fun onPause() {
                  super.onPause()
                  if (prepared && url.isNotEmpty()) {
                      val p = vv.currentPosition
                      val d = vv.duration
                      Store.setVideoPos(this, url, p)
                      if (url.startsWith("http") && d > 0) {
                          if (p > 3000 && p < d - 3000) Store.setLastVideo(this, url, titleS, refererS, uaS, p, d) else Store.clearLastVideo(this, url)
                      }
                  }
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  try { vv.stopPlayback() } catch (e: Exception) { }
                  super.onDestroy()
              }
          }
          AMLICH_EOF
          mkdir -p "app/src/main/java/vn/luot/app"
          cat > "app/src/main/java/vn/luot/app/Store.kt" <<'AMLICH_EOF'
          package vn.luot.app

          import android.content.Context

          class Hist(val ts: Long, val title: String, val url: String)

          object Store {
              private fun sp(c: Context) = c.getSharedPreferences("luot", Context.MODE_PRIVATE)

              fun adOn(c: Context) = sp(c).getBoolean("adOn", true)
              fun setAdOn(c: Context, v: Boolean) = sp(c).edit().putBoolean("adOn", v).apply()
              fun adLevel(c: Context) = sp(c).getInt("adLevel", 1)
              fun setAdLevel(c: Context, v: Int) = sp(c).edit().putInt("adLevel", v).apply()
              fun theme(c: Context) = sp(c).getInt("theme", 2)
              fun setTheme(c: Context, v: Int) = sp(c).edit().putInt("theme", v).apply()
              fun fx3d(c: Context) = sp(c).getBoolean("fx3d", true)
              fun setFx3d(c: Context, v: Boolean) = sp(c).edit().putBoolean("fx3d", v).apply()
              fun saveHist(c: Context) = sp(c).getBoolean("saveHist", true)
              fun setSaveHist(c: Context, v: Boolean) = sp(c).edit().putBoolean("saveHist", v).apply()
              fun engine(c: Context) = sp(c).getInt("engine", 0)
              fun setEngine(c: Context, v: Int) = sp(c).edit().putInt("engine", v).apply()
              fun blockedTotal(c: Context) = sp(c).getInt("blockedTotal", 0)
              fun setBlockedTotal(c: Context, v: Int) = sp(c).edit().putInt("blockedTotal", v).apply()

              fun popupBlock(c: Context) = sp(c).getBoolean("popupBlock", true)
              fun setPopupBlock(c: Context, v: Boolean) = sp(c).edit().putBoolean("popupBlock", v).apply()
              fun popExc(c: Context): MutableSet<String> = HashSet(sp(c).getStringSet("popExc", emptySet()) ?: emptySet())
              fun setPopExc(c: Context, s: Set<String>) = sp(c).edit().putStringSet("popExc", HashSet(s)).apply()

              fun filterTs(c: Context) = sp(c).getLong("filterTs", 0L)
              fun filterCount(c: Context) = sp(c).getInt("filterCount", 0)
              fun setFilterInfo(c: Context, ts: Long, n: Int) = sp(c).edit().putLong("filterTs", ts).putInt("filterCount", n).apply()

              fun textZoom(c: Context) = sp(c).getInt("textZoom", 100)
              fun setTextZoom(c: Context, v: Int) = sp(c).edit().putInt("textZoom", v).apply()
              fun transLang(c: Context) = sp(c).getInt("transLang", 0)
              fun setTransLang(c: Context, v: Int) = sp(c).edit().putInt("transLang", v).apply()

              // hình nền trang chủ: 0 không, 1 nền có sẵn, 2 ảnh của bạn
              fun wpMode(c: Context) = sp(c).getInt("wpMode", 0)
              fun setWpMode(c: Context, v: Int) = sp(c).edit().putInt("wpMode", v).apply()
              fun wpPreset(c: Context) = sp(c).getInt("wpPreset", 0)
              fun setWpPreset(c: Context, v: Int) = sp(c).edit().putInt("wpPreset", v).apply()
              fun wpBlur(c: Context) = sp(c).getInt("wpBlur", 20)
              fun setWpBlur(c: Context, v: Int) = sp(c).edit().putInt("wpBlur", v).apply()
              fun wpDim(c: Context) = sp(c).getInt("wpDim", 25)
              fun setWpDim(c: Context, v: Int) = sp(c).edit().putInt("wpDim", v).apply()

              fun intVal(c: Context, k: String, d: Int) = sp(c).getInt(k, d)
              fun setIntVal(c: Context, k: String, v: Int) = sp(c).edit().putInt(k, v).apply()
              fun str(c: Context, k: String, d: String) = sp(c).getString(k, d) ?: d
              fun setStr(c: Context, k: String, v: String) = sp(c).edit().putString(k, v).apply()

              fun flag(c: Context, k: String, d: Boolean) = sp(c).getBoolean(k, d)
              fun setFlag(c: Context, k: String, v: Boolean) = sp(c).edit().putBoolean(k, v).apply()

              // thứ tự ô trong menu tính năng
              fun menuOrder(c: Context): List<String> = (sp(c).getString("menuOrder", "") ?: "").split(",").filter { it.isNotEmpty() }
              fun setMenuOrder(c: Context, l: List<String>) = sp(c).edit().putString("menuOrder", l.joinToString(",")).apply()

              fun exceptions(c: Context): MutableSet<String> = HashSet(sp(c).getStringSet("exc", emptySet()) ?: emptySet())
              fun setExceptions(c: Context, s: Set<String>) = sp(c).edit().putStringSet("exc", HashSet(s)).apply()

              // ---- lịch sử ----
              fun history(c: Context): List<Hist> {
                  val out = ArrayList<Hist>()
                  for (line in (sp(c).getString("hist", "") ?: "").split("\n")) {
                      val p = line.split("\t")
                      if (p.size == 3) {
                          val ts = p[0].toLongOrNull() ?: continue
                          out.add(Hist(ts, p[1], p[2]))
                      }
                  }
                  return out
              }

              private fun saveHistList(c: Context, l: List<Hist>) {
                  val s = l.joinToString("\n") { "${it.ts}\t${it.title.replace('\t', ' ').replace('\n', ' ')}\t${it.url.replace('\t', ' ').replace('\n', ' ')}" }
                  sp(c).edit().putString("hist", s).apply()
              }

              fun addHistory(c: Context, title: String, url: String) {
                  val l = ArrayList(history(c))
                  if (l.isNotEmpty() && l[0].url == url) l.removeAt(0)
                  l.add(0, Hist(System.currentTimeMillis(), title, url))
                  while (l.size > 500) l.removeAt(l.size - 1)
                  saveHistList(c, l)
              }

              fun removeHistory(c: Context, ts: Long) = saveHistList(c, history(c).filter { it.ts != ts })
              fun clearHistory(c: Context) = sp(c).edit().putString("hist", "").apply()

              // ---- yêu thích ----
              fun bookmarks(c: Context): List<Pair<String, String>> {
                  val out = ArrayList<Pair<String, String>>()
                  for (line in (sp(c).getString("bm", "") ?: "").split("\n")) {
                      val p = line.split("\t")
                      if (p.size == 2) out.add(Pair(p[0], p[1]))
                  }
                  return out
              }

              private fun saveBm(c: Context, l: List<Pair<String, String>>) {
                  sp(c).edit().putString("bm", l.joinToString("\n") { "${it.first.replace('\t', ' ').replace('\n', ' ')}\t${it.second}" }).apply()
              }

              fun isBookmark(c: Context, url: String) = bookmarks(c).any { it.second == url }
              fun addBookmark(c: Context, title: String, url: String) {
                  val l = ArrayList(bookmarks(c).filter { it.second != url })
                  l.add(0, Pair(title.ifBlank { url }, url))
                  saveBm(c, l)
              }
              fun removeBookmark(c: Context, url: String) = saveBm(c, bookmarks(c).filter { it.second != url })

              // ---- lối tắt trang chủ ----
              fun shortcuts(c: Context): MutableList<Pair<String, String>> {
                  val s = sp(c).getString("short", null)
                  val out = ArrayList<Pair<String, String>>()
                  if (s == null) {
