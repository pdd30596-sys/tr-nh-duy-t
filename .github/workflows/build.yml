              private fun cleanUrl(url: String): String {
                  return try {
                      val u = Uri.parse(url)
                      val q = u.encodedQuery ?: return url
                      val parts = q.split("&")
                      val keep = parts.filter { val k = it.substringBefore('=').lowercase(); !(trackParams.contains(k) || k.startsWith("utm_")) }
                      if (keep.size == parts.size) return url
                      u.buildUpon().encodedQuery(if (keep.isEmpty()) null else keep.joinToString("&")).build().toString()
                  } catch (e: Exception) { url }
              }

